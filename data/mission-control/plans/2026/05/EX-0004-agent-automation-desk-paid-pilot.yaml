schema_version: companiesascode.mission_control.plan.v2
id: mcplan-ex-0004
dev_code: EX-0004
title: Agent Automation Desk paid pilot
status: ready
owner: alexmorgan
priority: medium
priority_rank: 3
created_at: '2026-05-23'
updated_at: '2026-05-23'
context: |
  The first recommended monetization experiment of Lazurio Example Organization
  is a productized agent automation service: one active request, fast delivery
  of small operational outputs and human approval before every external action.

  The mechanism is inspired by a DesignJoy-style productized-service model, but
  the company does not copy its brand, delivery, claims or identity. The
  adaptation is its own: agent research, enrichment, SOPs, reports, no-code
  blueprints and local workflow prototypes for small B2B teams.
current_problem: The v1 plan recorded no separate problem statement; the context describes it.
target_state: |
  - Win a first paid pilot or a written buying signal.
  - Check whether the target customer understands the one-active-request model.
  - Find out which requests are the most repeatable for a future playbook.
  - Keep the whole test reputationally safe and manually approved.
scope:
  in:
  - A 14-day paid pilot at a fictional illustrative price [PILOT PRICE].
  - Manually approved contact with fictional sample prospects (an illustrative channel).
  - Fiverr as a secondary inbound channel for a narrow workflow triage gig, after a separate approval
    to publish it.
  - A one-page offer, ICP, prospect criteria, outreach drafts, a discovery script and an intake.
  - At most 8 hours of delivery for the first pilot before a stop/renegotiate decision.
  out:
  - Mass outbound, spam, fake urgency or fake engagement.
  - A guaranteed number of leads, sales calls or revenue.
  - Production automation connected to client accounts without a separate approval.
  - Work with non-public customer data without explicit consent.
  - A Fiverr gig that promises revenue, fully autonomous AI agents, scraping against the ToS or bypassing
    the platform's payments.
acceptance_criteria:
- There is an approved pilot price and an ICP for the first 20 contacts.
- There is a one-page offer and two outreach message variants ready for human approval.
- There is a prospect list or clear prospect criteria without non-public data.
- The Fiverr inbound variant has a launch sheet, guardrails and a stop/scale metric before any publication.
- Within 14 days of approving the outreach phase, there is 1 paid pilot, a buying signal or 3 qualified
  discovery calls.
- After the test, a run log records the result, the learnings and the stop/scale decision.
validation:
- Check every acceptance criterion against recorded evidence.
risk_notes:
- External outreach and sending messages require human approval.
- The offer must not promise revenue or results that the company does not control.
- The first client may push for a custom software project; that is outside the pilot scope.
- Delivery must be watched so that it does not exceed 8 hours without a chance of a higher price.
decisions:
- date: '2026-05-23'
  decision: Test it as the first monetization experiment.
  rationale: The shortest path to the first invoice without building a SaaS, high agent leverage and a
    low technical budget.
- date: '2026-05-23'
  decision: Add a Fiverr workflow triage gig as a secondary inbound channel, not as the main overnight
    first-dollar bet.
  rationale: Fiverr shows visible demand for automation/workflow services, but a new seller without a
    reputation has no reliable overnight distribution. A narrow gig can therefore run in parallel after
    approval, while the main first-dollar test stays direct checkout and warm outreach.
planning_target:
  scope: lazurio-example-organization
  todo_tasks_path: data/mission-control/TODO.tasks.json
proposed_tasks:
- title: Approve the Agent Automation Desk pilot parameters
  summary: Prepare the decision input for the price, ICP, prospect criteria and the limits of the manual
    outreach test.
  priority: high
  tags:
  - monetization
  - approval
  - pilot
  acceptance_criteria:
  - The final pilot price or an explicit price test is recorded.
  - The first ICP segment and the exclusion criteria are recorded.
  - It is clear who may be contacted in the first wave.
  - It is recorded which external actions wait for human confirmation.
  risk_notes:
  - No outreach may be sent without approval.
  - The price must not be presented as a guaranteed business result.
- title: Prepare the first manually approved prospect shortlist
  summary: Create a list of 10-20 suitable B2B contacts or companies by the approved criteria, without
    non-public data and without sending messages.
  priority: high
  tags:
  - prospects
  - outreach-prep
  - first-dollar
  acceptance_criteria:
  - Every prospect has a reason for the fit and a public source for the signal.
  - The list contains no non-public customer data or credentials.
  - Every prospect has a proposed safest contact channel.
  - The output waits for human approval before anything is sent.
- title: Prepare a run log for the first pilot iteration
  summary: Create a concrete run log from the template and prepare fields for replies, calls, buying signals,
    delivery time and the stop/scale decision.
  priority: medium
  tags:
  - run-log
  - experiment
  - evidence
  acceptance_criteria:
  - The run log has a start date, a hypothesis, a metric, a stop condition and a scale condition.
  - The run log separates anonymized evidence from sensitive data.
  - It is clear where the outcome is recorded after 14 days.
- title: Approve and possibly publish the Fiverr workflow triage gig
  summary: Use the prepared Fiverr launch sheet to set up a narrow gig for AI automation workflow triage
    by hand, without off-platform payments, spam automation or revenue promises.
  priority: medium
  tags:
  - fiverr
  - inbound
  - marketplace
  - first-dollar
  acceptance_criteria:
  - Alex confirms the Fiverr seller onboarding and explicitly approves the publication.
  - The gig uses three fictional package prices [BASIC] / [STANDARD] / [PREMIUM].
  - The gig contains no off-platform payment/contact links or forbidden automation claims.
  - The first 14 days measure impressions, clicks, qualified messages, orders and out-of-scope requests.
  risk_notes:
  - A new seller without a reputation may get noise or no orders; Fiverr is not the main overnight channel.
  - Buyer requests may aim at spam, scraping or work with sensitive data; such requests are declined or
    scoped only after a separate approval.
