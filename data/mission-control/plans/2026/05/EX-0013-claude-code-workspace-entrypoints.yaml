schema_version: companiesascode.mission_control.plan.v2
id: mcplan-ex-0013
dev_code: EX-0013
title: Claude Code workspace entrypoints
status: done
owner: alexmorgan
priority: medium
priority_rank: 12
created_at: '2026-05-23'
updated_at: '2026-05-23'
context: |
  AgentMint už má sdílenou `.claude/skills` knihovnu, Codex symlink `.agents/skills` a root `AGENTS.md` psaný tak, aby ho četl i Claude Code. Chybí ale nativní root entrypoint `CLAUDE.md`, který Claude Code okamžitě navede na GEN2 kaskádu místo toho, aby agent duplikoval pravidla nebo přeskočil preflight.

  Cílem je udělat workspace pro Claude Code čitelný bez zavedení druhé agentní pravdy. `AGENTS.md` zůstává autoritativní operační příručka, `CLAUDE.md` má být tenký adapter pro Claude Code.
current_problem: The v1 plan recorded no separate problem statement; the context describes it.
target_state: |
  - Přidat Claude Code nativní vstup, který odkazuje na `AGENTS.md` a povinný preflight.
  - Udržet jeden source of truth pro agentní pravidla a skills.
  - Doplnit doctor kontrolu, která upozorní na chybějící nebo driftující Claude Code entrypoint.
  - Srovnat onboarding texty, aby Claude Code nebyl popsaný jako vedlejší nebo cizí nástroj.
scope:
  in:
  - Root Claude Code entrypoint.
  - Dokumentace vztahu Claude Code, Codex, `.claude/skills` a `AGENTS.md`.
  - Doctor guard pro entrypoint a skill symlink.
  - Onboarding lekce, která už popisuje Codex, Cursor a Claude Code.
  out:
  - Spouštět nebo měnit Claude Code MCP konfiguraci v user `~/.claude`.
  - Otevírat externí účty, instalovat Claude Code nebo měnit globální nastavení.
  - Aktivovat Claude backend v Launchpadu.
acceptance_criteria:
- Root obsahuje `CLAUDE.md` jako tenký Claude Code adapter bez duplicit dlouhých pravidel.
- '`.claude/README.md`, root docs a guide vysvětlují vztah `CLAUDE.md` -> `AGENTS.md`.'
- '`company/scripts/doctor.sh check` ověří existenci a základní obsah `CLAUDE.md`.'
- PowerShell varianta doctoru má stejný guardrail pro Windows kolegy.
- Změny projdou relevantní validací task ledgeru, doctor checkem a guide buildem.
validation:
- Check every acceptance criterion against recorded evidence.
implementation_validation:
- |
  Outcome recorded in v1: Workspace má nově root `CLAUDE.md`, který Claude Code navádí na `AGENTS.md`, povinný preflight, doctor context check a sdílenou `.claude/skills` knihovnu. Root dokumenty a `.claude/README.md` popisují, že `CLAUDE.md` je jen adapter, ne druhý source of truth.

  Doctor v shell i PowerShell variantě nově kontroluje existenci `CLAUDE.md` a základní obsah (`AGENTS.md` + `check-my-context`). Guide lekce 11 vysvětluje rozdíl mezi Codexem, Claude Code a Cursorem v AgentMint kontextu.
risk_notes:
- '`CLAUDE.md` nesmí být druhá kopie `AGENTS.md`, jinak vznikne drift mezi agenty.'
- Do sdíleného repa nesmí přijít tokeny, MCP session data ani osobní absolutní cesty.
- 'Doctor guard musí zůstat cross-platform: shell i PowerShell varianta.'
decisions:
- date: '2026-05-23'
  decision: '`CLAUDE.md` bude tenký adapter na `AGENTS.md`, ne paralelní agentní manuál.'
  rationale: AgentMint potřebuje podporovat Claude Code nativně, ale zachovat jednu operační pravdu pro
    všechny agenty.
