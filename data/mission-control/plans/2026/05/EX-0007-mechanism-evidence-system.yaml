schema_version: companiesascode.mission_control.plan.v2
id: mcplan-ex-0007
dev_code: EX-0007
title: Mechanism evidence system
status: ready
owner: alexmorgan
priority: medium
priority_rank: 6
created_at: '2026-05-23'
updated_at: '2026-05-23'
context: |
  Lazurio Example Organization has an existing research sprint with candidates
  such as Remote Leaf, ScrapingBee, Bannerbear, Carrd, BuiltWith, GummySearch,
  Easlo, ShipFast, Text Blaze, TLDR Newsletter and HeadshotPro. So that this
  does not become a pile of interesting stories, we need a repeatable evidence
  system for mechanisms: what makes money, for whom, through which channel, with
  what proof, what the guardrails are and what the smallest first test is.

  Mission Control should hold the strategic decisions and goals; the detailed
  scans probably belong in the research module or the knowledgebase once the
  final structure is clear.
current_problem: The v1 plan recorded no separate problem statement; the context describes it.
target_state: |
  - Define a uniform mechanism scan for online projects with a monetization signal.
  - Separate the revenue evidence, the adaptable mechanism and the forbidden copying of identity.
  - Prepare the shortlist so that it converts directly into experiment cards.
scope:
  in:
  - A schema or Markdown template for one mechanism scan.
  - Fields for the revenue signal, source URL, verification date, confidence and ToS/legal risk.
  - Scoring criteria for time-to-first-dollar, agent leverage and reputational fit.
  out:
  - Copying other companies' databases, copy, brand assets or customer lists.
  - Automatically marking revenue claims as true without a source and a date.
  - Collecting data in a way that bypasses the ToS or privacy boundaries.
acceptance_criteria:
- There is a mechanism scan template usable for 25-40 candidates.
- Every scan has an explicit "what to adapt" and "what not to copy" part.
- Scoring can pick the top candidates for an experiment without manual debate.
- The output links to the original research sprints and their verification dates.
validation:
- Check every acceptance criterion against recorded evidence.
risk_notes:
- Online revenue data goes stale quickly and may be embellished by marketing.
- A strong revenue signal does not mean that the company can safely repeat the mechanism.
- An agent must not generate a plan based on spam, scraping abuse or misleading claims.
decisions:
- date: '2026-05-23'
  decision: Mechanism scans should be evidence-first, and the legal adaptation should be a separate field.
  rationale: The company's goal is to copy the mechanism, not the identity or unverified stories.
planning_target:
  scope: lazurio-example-organization
  todo_tasks_path: data/mission-control/TODO.tasks.json
proposed_tasks:
- title: Design the mechanism scan template
  summary: Define a YAML or Markdown template for candidates with revenue evidence, the mechanism, the
    legal adaptation, guardrails and a first test.
  priority: high
  tags:
  - research
  - schema
  - mechanisms
  acceptance_criteria:
  - The template contains the revenue signal, source URL, verified_at and confidence.
  - The template separates mechanism, customer, channel, pricing, delivery and risk.
  - The template contains both the allowed adaptation and the forbidden copying.
- title: Convert the shortlist of top candidates into mechanism scans
  summary: Take the most important candidates from the research sprint and rewrite them in the uniform
    evidence format.
  priority: medium
  tags:
  - research
  - shortlist
  - evidence
  acceptance_criteria:
  - At least 10 candidates have a uniform scan.
  - Every candidate has a first test for the company or a reason for postponing it.
  - The output is stored in the module scope that becomes the source of truth for research.
