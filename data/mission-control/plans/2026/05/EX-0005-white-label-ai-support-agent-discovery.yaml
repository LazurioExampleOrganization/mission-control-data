schema_version: companiesascode.mission_control.plan.v2
id: mcplan-ex-0005
dev_code: EX-0005
title: White-label AI support agent discovery
status: shaping
owner: alexmorgan
priority: medium
priority_rank: 4
created_at: '2026-05-23'
updated_at: '2026-05-23'
context: |
  The second monetization experiment candidate: a done-with-you setup of a
  specialized AI support agent for agencies and their clients. The mechanism
  builds on the demand for support chatbots and knowledge-base agents, but the
  company's adaptation must rest on data supplied with consent, a clear scope
  and a safe handoff.

  This plan does not start delivery yet. It shapes a discovery test that checks
  whether agencies want a white-label offer and are willing to carry part of the
  support responsibility towards their clients.
current_problem: The v1 plan recorded no separate problem statement; the context describes it.
target_state: |
  - Check the agencies' interest in a white-label AI support setup.
  - Find out what minimal setup could be sold without a large technical commitment.
  - Separate the demand for a one-off setup from a long-term support retainer.
scope:
  in:
  - A discovery offer for web/design/marketing agencies.
  - A done-with-you setup over a public website or data supplied with consent.
  - A proposal for a safe pilot scope, price and responsibilities.
  out:
  - Connecting to client accounts without explicit approval.
  - Work with non-public customer data without governance.
  - Guaranteeing answer accuracy without a human review workflow.
acceptance_criteria:
- There is a discovery script for agencies and their concerns.
- There is a proposal for a minimal pilot package.
- There is a risk checklist for data, liability and hallucinations.
- The plan has a decision whether to test after Agent Automation Desk or to postpone.
validation:
- Check every acceptance criterion against recorded evidence.
risk_notes:
- A support bot can damage the client's trust if it answers wrongly.
- The white-label model blurs responsibility between the company, the agency and the end client.
- Technical delivery can quickly grow into a custom integration project.
decisions:
- date: '2026-05-23'
  decision: Do not test it first; prepare it only as the second candidate.
  rationale: The B2B signal is strong, but the integration commitment is higher than for Agent Automation
    Desk.
planning_target:
  scope: lazurio-example-organization
  todo_tasks_path: data/mission-control/TODO.tasks.json
proposed_tasks:
