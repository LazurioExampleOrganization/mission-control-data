schema_version: companiesascode.mission_control.plan.v2
id: mcplan-ex-0005
dev_code: EX-0005
title: White-label AI support agent discovery
status: shaping
owner: alexmorgan
priority: medium
priority_rank: 4
created_at: '2026-05-23'
updated_at: '2026-05-23'
context: |
  Druhý kandidát monetizačního experimentu: done-with-you nastavení
  specializovaného AI support agentu pro agentury a jejich klienty.
  Mechanismus vychází z poptávky po support chatbotech a knowledge-base
  agentech, ale AgentMint adaptace musí být postavená na datech dodaných se
  souhlasem, jasném scope a bezpečném handoffu.

  Tento plán zatím nemá startovat delivery. Má zformovat discovery test, který
  ověří, jestli agentury chtějí white-label nabídku a jsou ochotné nést část
  support odpovědnosti vůči svým klientům.
current_problem: The v1 plan recorded no separate problem statement; the context describes it.
target_state: |
  - Ověřit zájem agentur o white-label AI support setup.
  - Zjistit, jaký minimální setup by šel prodat bez velkého technického závazku.
  - Oddělit poptávku po jednorázovém setupu od dlouhodobého support retaineru.
scope:
  in:
  - Discovery nabídka pro web/design/marketing agentury.
  - Done-with-you setup nad veřejným webem nebo daty dodanými se souhlasem.
  - Návrh bezpečného pilot scope, ceny a odpovědností.
  out:
  - Připojení na klientské účty bez explicitního approvalu.
  - Práce s neveřejnými zákaznickými daty bez governance.
  - Garance přesnosti odpovědí bez human review workflow.
acceptance_criteria:
- Existuje discovery script pro agentury a jejich obavy.
- Existuje návrh minimálního pilot package.
- Existuje rizikový checklist pro data, odpovědnost a hallucinations.
- Plán má rozhodnutí, zda testovat po Agent Automation Desk nebo odložit.
validation:
- Check every acceptance criterion against recorded evidence.
risk_notes:
- Support bot může poškodit důvěru klienta, pokud odpovídá špatně.
- White-label model rozmazává odpovědnost mezi AgentMintem, agenturou a koncovým klientem.
- Technická delivery může rychle přerůst do custom integration projektu.
decisions:
- date: '2026-05-23'
  decision: Netestovat jako první; připravit až jako druhý kandidát.
  rationale: B2B signál je silný, ale integrační závazek je vyšší než u Agent Automation Desk.
