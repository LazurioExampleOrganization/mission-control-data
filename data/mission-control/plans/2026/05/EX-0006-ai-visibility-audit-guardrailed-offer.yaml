schema_version: companiesascode.mission_control.plan.v2
id: mcplan-ex-0006
dev_code: EX-0006
title: AI visibility audit guardrailed offer
status: shaping
owner: alexmorgan
priority: medium
priority_rank: 5
created_at: '2026-05-23'
updated_at: '2026-05-23'
context: |
  The third candidate: a paid audit of how a brand appears in search,
  communities and AI answers, plus transparent recommendations for content and
  positioning changes. The agent advantage lies in collecting signals, citing
  sources and fast synthesis.

  This direction is more reputationally sensitive than Agent Automation Desk.
  Before any test, fake accounts, stealth posting, community manipulation and
  unlabelled promotion must be clearly forbidden.
current_problem: The v1 plan recorded no separate problem statement; the context describes it.
target_state: |
  - Design a paid audit that is useful without manipulative tactics.
  - Record guardrails for sources, citations, community data and recommended actions.
  - Check whether the buyer pays for the audit, not just for a free insight.
scope:
  in:
  - An audit of the public signals of the brand and its competitors.
  - A transparent report with sources, the verification date and confidence.
  - Recommendations for a content/opportunity backlog without fake engagement.
  out:
  - Stealth posting, fake accounts, astroturfing or review manipulation.
  - Scraping against the ToS.
  - Claims that the company can guarantee AI answers or rankings.
acceptance_criteria:
- There is a guardrail document for the audit and the recommended actions.
- There is a sample report structure in a citations-first style.
- There is a price and a stop condition for the first 5 audits.
- Before outreach, it is decided whether the reputational risk fits the Lazurio Example Organization brand.
validation:
- Check every acceptance criterion against recorded evidence.
risk_notes:
- The direction is close to SEO/PR grey zones; without guardrails it easily drifts towards manipulation.
- AI answers are unstable and cannot be guaranteed.
- A potential customer may want tactics that the company should not use.
decisions:
- date: '2026-05-23'
  decision: Prepare guardrails before any test.
  rationale: The revenue signal is interesting, but the reputational risk is higher than for the service
    pilot.
planning_target:
  scope: lazurio-example-organization
  todo_tasks_path: data/mission-control/TODO.tasks.json
proposed_tasks:
- title: Write guardrails for the AI visibility audit
  summary: Define the allowed sources, forbidden tactics, citations, confidence and the limits of recommendations
    before designing the offer.
  priority: medium
  tags:
  - guardrails
  - visibility-audit
  - reputational-risk
  acceptance_criteria:
  - The guardrails explicitly forbid fake accounts, stealth posting and review manipulation.
  - Every recommendation in the report must have a source or be marked as a hypothesis.
  - The document contains a decision criterion for when to decline an audit.
