schema_version: companiesascode.mission_control.plan.v2
id: mcplan-ex-0011
dev_code: EX-0011
title: Dogfood Mission Control planning loop
status: in_progress
owner: alexmorgan
priority: medium
priority_rank: 10
created_at: '2026-05-23'
updated_at: '2026-05-23'
context: |
  We are testing Mission Control by planning the further development of Mission Control in it. The goal is to walk the whole loop: a plan is created as YAML, the plan contains decisions and proposed tasks, the export creates implementation TODOs and the result returns to the plan as evidence.

  This dogfood test should show whether Mission Control really holds the strategic context better than a chat or an ad hoc TODO entry.
current_problem: The v1 plan recorded no separate problem statement; the context describes it.
target_state: |
  - Use Mission Control as the source of truth for Mission Control's own development.
  - Check that a plan can be turned into concrete implementation tasks without manual copying.
  - Capture the friction points that keep agents from planning comfortably through the filesystem DB.
scope:
  in:
  - Create a dogfood plan in Mission Control.
  - Generate and materialize TODO tasks through the Mission Control export.
  - Add `todo_outputs` and an outcome/evidence note to the plan.
  - Evaluate what is missing for planning the company's strategy.
  out:
  - Building the whole Linear-like core in one step.
  - Working on monetization experiments before the planning core.
  - Introducing an external planning tool as the source of truth.
acceptance_criteria:
- The plan exists as valid YAML in Mission Control `plans/`.
- A dry-run export of the plan proposes concrete implementation tasks.
- An apply export writes the tasks to `mission-control/TODO.tasks.json` with planning references.
- The plan has `todo_outputs` filled in for the created tasks.
- There is a short evaluation of the friction points for the next Mission Control iteration.
validation:
- Check every acceptance criterion against recorded evidence.
implementation_validation:
- |
  Outcome recorded in v1: The dogfood loop succeeded in the first iteration. The plan was created through the Mission Control API, the dry-run export generated three concrete tasks and --apply wrote them to mission-control/TODO.tasks.json with a planning reference back to this YAML plan.

  Friction found: the create API cannot add decisions when a plan is created, so the decisions had to be added in a follow-up update step. This confirms the priority of the task for a decisions editor field. Second finding: the workflow is usable, but strategic planning will need a dedicated view for initiatives/projects/issues, so that people do not have to look for everything in the plan list alone.

  Bug from the dogfood: a repeated export of an already materialized plan originally proposed new task IDs. Fixed in the export layer: the export now recognizes existing tasks by the mission-control planning reference and title, keeps their original IDs, and --apply does not add them again.
risk_notes:
- The dogfood must not bypass its own rules; tasks must come from the Mission Control export, not just
  from manual entries.
- If the workflow turns out to be uncomfortable, that is a valid test result and should be recorded as
  friction, not hidden.
- Do not plan the company's business strategy until the planning core is stable enough to capture decisions.
decisions:
- date: '2026-05-23'
  decision: Mission Control development will be planned in Mission Control itself.
  rationale: The dogfood loop checks that the tool can hold the strategic context, materialize TODOs and
    return evidence to the plan.
- date: '2026-05-23'
  decision: The planning core takes priority over monetization work.
  rationale: The company first needs a stable place for strategy, decisions and the work breakdown; otherwise
    the business context falls apart between chat, research and task ledgers.
todo_outputs:
- task-2026-05-23-003
- task-2026-05-23-004
- task-2026-05-23-005
planning_target:
  scope: lazurio-example-organization
  todo_tasks_path: data/mission-control/TODO.tasks.json
proposed_tasks:
- title: Evaluate the Mission Control dogfood planning loop
  summary: Walk through plan -> export -> TODO -> evidence back and record which parts run smoothly and
    which slow agents down.
  priority: high
  tags:
  - dogfood
  - planning
  - friction
  acceptance_criteria:
  - What worked in the plan -> TODO flow is described.
  - What needed manual intervention outside the UI or API is described.
  - There is a recommendation for the next Mission Control improvement.
- title: Design a minimal strategic planning view for Lazurio Example Organization
  summary: From the dogfood experience, design the first view in which the company's strategy can be planned
    before monetization work.
  priority: high
  tags:
  - strategy
  - view
  - mission-control
  acceptance_criteria:
  - The view clearly separates initiatives, projects, issues and decisions.
  - The view shows ready/in_progress strategic plans and their TODO outputs.
  - The design needs no external database or cloud service.
- title: Add the missing editor field for decisions
  summary: The UI detail already shows decisions, but the edit modal cannot edit them comfortably; add
    a minimal text field or a YAML-friendly editor pattern.
  priority: medium
  tags:
  - ui
  - decisions
  - editor
  acceptance_criteria:
  - An agent or a person can add a decision with a date and a rationale through the UI.
  - Saving keeps the YAML schema valid.
  - The existing plans UI stays functional.
links:
- label: Linear-like core plan
  path: mission-control/plans/2026/05/mission-control-linear-filesystem-core.yaml
- label: Mission Control architecture
  path: mission-control/ARCHITECTURE.md
- label: Mission Control TODO
  path: mission-control/TODO.tasks.json
import_review:
  path: data/mission-control/import-reviews/2026-10-16-v1-import/parity-report.md
  schema_fit: Imported from v1 plan plan-2026-05-23-010 (mission-control/plans/2026/05/dogfood-mission-control-planning-loop.yaml).
  schema_changes:
  - priority and priority_rank were not recorded in v1; set to medium and the v1 id order.
  - current_problem and validation were not recorded in v1; filled with a neutral statement.
  - target_state is the list of v1 goals.
  - The v1 outcome is kept in implementation_validation.
