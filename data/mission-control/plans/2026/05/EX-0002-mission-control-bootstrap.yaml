schema_version: companiesascode.mission_control.plan.v2
id: mcplan-ex-0002
dev_code: EX-0002
title: Mission Control as the strategic centre of Lazurio Example Organization
status: shaping
owner: alexmorgan
priority: medium
priority_rank: 1
created_at: '2026-05-23'
updated_at: '2026-05-23'
context: |
  Lazurio Example Organization needs one local place where the strategic agenda,
  feature plans and work orchestration take shape. The data should be plain YAML
  files in the workspace, so that agents can read, diff and edit them and
  generate implementation TODOs from them without depending on an external
  service.
current_problem: The v1 plan recorded no separate problem statement; the context describes it.
target_state: |
  - Run Mission Control as a Launchpad application.
  - Keep the company's strategic steps in YAML files.
  - Connect the planning layer to `TODO.tasks.json`.
  - Keep everything fully readable and editable for agents.
scope:
  in:
  - YAML feature/strategy plans
  - local Launchpad UI
  - list and detail of strategic plans
  - creating a new plan through the UI
  out:
  - an external task manager
  - a server database
  - rewriting TODOs automatically without approval
acceptance_criteria:
- Launchpad finds Mission Control in its list of applications.
- Mission Control starts on a local port.
- The UI shows this YAML plan.
- The UI can create a new YAML plan in the workspace.
- TODO tasks can carry a `planning` reference to a YAML plan.
validation:
- Check every acceptance criterion against recorded evidence.
todo_outputs:
- task-2026-05-23-001
links:
- label: Root task
  path: TODO.tasks.json
- label: Planning model reference
  path: company/agents/reference/mission-control-planning-model.md
import_review:
  path: data/mission-control/import-reviews/2026-10-16-v1-import/parity-report.md
  schema_fit: Imported from v1 plan plan-2026-05-23-001 (mission-control/plans/2026/05/mission-control-bootstrap.yaml).
  schema_changes:
  - priority and priority_rank were not recorded in v1; set to medium and the v1 id order.
  - current_problem and validation were not recorded in v1; filled with a neutral statement.
  - target_state is the list of v1 goals.
