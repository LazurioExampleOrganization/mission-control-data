schema_version: companiesascode.mission_control.plan.v2
id: mcplan-ex-0012
dev_code: EX-0012
title: Mission Control as a root repo and work board for agents
status: done
owner: alexmorgan
priority: medium
priority_rank: 11
created_at: '2026-05-23'
updated_at: '2026-05-23'
context: |
  Mission Control should not be a business module in `modules/` but a workspace control-plane layer next to `launchpad/`. The user wants it to have its own root-level repo, like `infra/`, and at the same time a UI where the Workspace Admin, the Workspace Manager and Power Users see the scanned `TODO.tasks.json`, `DONE.tasks.json` and `ISSUES.open.json` as a kanban overview of work for agents.

  The plan holds the context and the decisions. The task ledgers hold the concrete actionable work, and every TODO task should have a `planning` reference back to the Mission Control plan.
current_problem: The v1 plan recorded no separate problem statement; the context describes it.
target_state: |
  - Promote Mission Control to the root-level control-plane repo `mission-control/`.
  - Keep the Launchpad discovery and Mission Control's fixed port.
  - Add the first read-only work board over the TODO/DONE/ISSUES ledgers.
  - Make visible which TODO tasks do not have a Mission Control plan yet.
scope:
  in:
  - The root-level move of the local Mission Control repo.
  - Launchpad discovery for root-level manifest slots.
  - A read-only work board over the filesystem ledgers.
  - Updates to the documentation, skills and planning references.
  out:
  - Full role-based permissions or authentication.
  - Drag-and-drop task editing.
  - Automatic rewriting of old root TODO tasks without a planning reference.
acceptance_criteria:
- '`company/scripts/modules.manifest.json` points Mission Control to `mission-control/`.'
- The Launchpad registry can discover an app-bearing manifest slot outside `modules/`.
- The Mission Control API provides a work board over `TODO.tasks.json`, `DONE.tasks.json` and `ISSUES.open.json`.
- The UI shows the kanban columns planned, in progress, review, blocked, done and issues.
- The work board shows planning coverage for TODO tasks.
- The export to TODO computes the workspace root correctly after the move from `modules/mission-control`.
validation:
- Check every acceptance criterion against recorded evidence.
implementation_validation:
- |
  Outcome recorded in v1: Mission Control was moved from `modules/mission-control/` to the root-level `mission-control/` and initialized as a local nested Git repo. The Launchpad registry can discover the root-level manifest slot, and Mission Control runs on its original port 5693.

  The V1 UI has a new Work board section for the Workspace Admin, the Workspace Manager and Power Users. The server endpoint `/api/work-board` scans `TODO.tasks.json`, `DONE.tasks.json` and `ISSUES.open.json` across the workspace, builds the kanban columns and shows planning coverage. The smoke test confirmed 11 valid plans, 14 TODO items, 2 open issues and no invalid UI blocks.
risk_notes:
- The super-repo must not start tracking the nested repo's content or a gitlink pointer.
- The ledger scanner must not walk build/cache/runtime folders.
- Older TODO tasks without Mission Control plans should first be made visible, not silently rewritten.
decisions:
- date: '2026-05-23'
  decision: Mission Control belongs in the workspace root as a control-plane repo.
  rationale: Mission Control's role is planning and orchestrating the whole workspace agenda, so it sits
    on the same layer as Launchpad or Infra; it is not a domain business module.
- date: '2026-05-23'
  decision: The first work board will be a read-only scanner of the filesystem ledgers.
  rationale: First we need to see the state of work and the planning coverage truthfully; editing and
    role-based rules can come only after the core model is verified.
todo_outputs:
- task-2026-05-23-007
planning_target:
  scope: lazurio-example-organization
  todo_tasks_path: data/mission-control/TODO.tasks.json
proposed_tasks:
