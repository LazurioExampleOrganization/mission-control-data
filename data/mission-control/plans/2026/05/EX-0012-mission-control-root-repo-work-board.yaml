  summary: Dokončit přesun Mission Controlu na root-level repo, přidat work board nad task ledgery, aktualizovat
    reference a ověřit Launchpad smoke test.
  priority: high
  tags:
  - root-repo
  - work-board
  - launchpad
  acceptance_criteria:
  - Launchpad objeví Mission Control z root-level manifest slotu.
  - Work board API vrací TODO/DONE/ISSUES sloupce.
  - UI ukazuje planning coverage a odkazy na plány.
  - Build, registry testy a workspace task validace projdou.
