  summary: Finish moving Mission Control to the root-level repo, add the work board over the task ledgers,
    update the references and verify the Launchpad smoke test.
  priority: high
  tags:
  - root-repo
  - work-board
  - launchpad
  acceptance_criteria:
  - Launchpad discovers Mission Control from the root-level manifest slot.
  - The work board API returns TODO/DONE/ISSUES columns.
  - The UI shows planning coverage and links to the plans.
  - The build, the registry tests and the workspace task validation pass.
