schema_version: companiesascode.mission_control.plan.v2
id: mcplan-ex-0008
dev_code: EX-0008
title: Mission Control V1 implementation
status: in_progress
owner: alexmorgan
priority: medium
priority_rank: 7
created_at: '2026-05-23'
updated_at: '2026-05-23'
context: |
  Mission Control should stop being just a smoke-tested Launchpad app and become
  the real place where the company plans its strategic steps. V1 must keep a
  YAML source of truth, a usable UI for list/detail/create/edit, validation
  against the schema and a safe dry-run export to TODO.tasks.json.

  State as of 2026-05-23: the skeleton runs, the YAML database exists, and the
  app has separate modules for plans, validation, export and UI. This plan holds
  the implementation definition and follows up on the V1 brief.
current_problem: The v1 plan recorded no separate problem statement; the context describes it.
target_state: |
  - Turn Mission Control into a usable planning cockpit for strategic steps.
  - Keep YAML as the authoritative database without an external service.
  - Make it possible to turn plans into concrete TODO tasks without manual copying.
scope:
  in:
  - Plan list, detail, create and edit through the local Launchpad UI.
  - Validation of YAML plans against the JSON Schema.
  - A dashboard with counts by status.
  - Dry-run export of proposed tasks to TODO.tasks.json.
  - Display of scope, risks, decisions, links and proposed_tasks.
  out:
  - An external task manager or a cloud database.
  - Automatic task materialization without an explicit mode.
  - A role/permission system or a multi-user server.
acceptance_criteria:
- Mission Control can be started through Launchpad on port 5693.
- The UI can create and edit a strategic plan without losing YAML data.
- An invalid plan is marked in the UI and shows the schema errors.
- By default, the export script only prints a dry-run proposal.
- Every exported task contains a planning reference back to the YAML plan.
- The smoke test for list, detail, create, edit, validation and export passes.
validation:
- Check every acceptance criterion against recorded evidence.
risk_notes:
- The UI must not be the only source of truth; editing the YAML by hand must stay safe.
- The export must not overwrite existing TODO tasks without an explicit apply mode.
- An app that is too clever could replace the simple file workflow; V1 should stay small.
decisions:
- date: '2026-05-23'
  decision: Mission Control stays a file-system-first module.
  rationale: Agents should be able to work with plans natively as files, without vendor lock-in and without
    a hidden DB.
todo_outputs:
- task-2026-05-23-002
planning_target:
  scope: lazurio-example-organization
  todo_tasks_path: data/mission-control/TODO.tasks.json
proposed_tasks:
- title: Finish the detail view of the strategic fields in the UI
  summary: Make sure that the Mission Control detail shows scope, risk_notes, decisions, links, todo_outputs,
    planning_target and proposed_tasks.
  priority: high
  tags:
  - ui
  - mission-control
  - planning
  acceptance_criteria:
  - The plan detail shows all main schema fields.
  - The mobile layout stays readable.
  - An invalid plan shows the specific errors.
- title: Verify the dry-run export on a real plan
  summary: Run export-todo-tasks.mjs on the Agent Automation Desk plan and check that the output is a
    valid TODO proposal with planning references.
  priority: high
  tags:
  - export
  - todo
  - validation
  acceptance_criteria:
  - The dry run returns at least one proposed task.
  - Every task has source mission-control and planning.plan_id.
  - Without --apply, the script does not write to TODO.tasks.json.
