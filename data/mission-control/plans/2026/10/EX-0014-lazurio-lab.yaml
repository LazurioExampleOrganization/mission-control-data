proposed_tasks:
  - id: task-2026-10-18-001
    title: "L1: Teams, grants and the public access matrix"
    summary: "Repositories: the GitHub Organization settings and the public access documentation (`access/` in `infra`). Team `lazurio-alena` (closed, Alena only, no grants) exists; an Admin created it on 2026-10-18. Create the closed Teams `finance` (Bob only; Write on finance) and `sales` (shares the sales modules with `workspace`, D30). Give each Team its grants from one matrix of module, Team and right, where restricted means read without Write (D23), and publish that matrix. Visitors get no Team and no GitHub membership (D20). Nothing starts before the Owner approves EX-0014."
    priority: high
    priority_rank: 61
    assignee: Example thread
    priority_decider: organization-admin
    priority_reason: "Every later milestone depends on who may do what; the matrix is the lab's first visible artifact."
    tags: [EX-0014, lab, github, teams, access]
    acceptance_criteria:
      - "The Teams exist as closed Teams with the grants of the published matrix, read back via gh."
      - "The matrix lists every module and root application repository with the right of each Team and person."
      - "infra#2 is answered and closed with a link to the matrix."
    risk_notes:
      - "Members are only the Lazurio maintainers and the test accounts, so no visitor's data enters the Organization; visitors enter `try-01` with their Lazurio login and never appear in the Organization's GitHub or repositories (D33)."
    blocked_by: []
  - id: task-2026-10-18-002
    title: "L1: rulesets and CODEOWNERS on every public repository"
    summary: "Repositories: every public repository of the Organization. Extend each default-branch ruleset with a required pull request and required CI, keep no deletion and no force push, give Lazurio for GitHub no bypass, and add CODEOWNERS (finance and pricing to Bob, the rest to `workspace`). Switch on one required approval when the review automations of task 011 run. Document the private Deployment Repo as the one exception (GitHub Free has no rulesets for private repositories) and the merge method that keeps the noreply author."
    priority: high
    priority_rank: 62
    assignee: Example thread
    priority_decider: organization-admin
    priority_reason: Real approval processes need the rules GitHub enforces, not only a written agreement.
    tags: [EX-0014, lab, github, rulesets, codeowners]
    acceptance_criteria:
      - Every public repository's default branch rejects a direct push, a force push and deletion, and requires CI; read back via gh.
      - After task 011, a pull request cannot merge without one approval from an account other than its author.
      - The access documentation names the private Deployment Repo exception and the merge method.
    risk_notes:
      - A required approval without running automations stalls all work; it is switched on only with task 011.
    blocked_by: [task-2026-10-18-001]
