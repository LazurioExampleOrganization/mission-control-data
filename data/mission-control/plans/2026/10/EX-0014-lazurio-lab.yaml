  - "Q14 The shape of the account deletion or reset that D29 needs; it is designed in the maintainers' plan."
  - "Q16 Does D36 still stand, so that a new `lazurio-bob` replaces `admin-01` as Bob's Work Environment (tasks 003, 004 and 018), or does Bob keep `admin-01`, as the rollout pipeline owner decided on 2026-10-21 from D12 (D44 (a))? Until the Owner answers, `admin-01` is Bob's Work Environment, the tailnet server node and the place of the Ring 0 acceptance of Buddy on the web, while the `lazurio-bob` parts of the plan stay as D36 wrote them."
dependencies:
  - "Lazurio/LazurioPlatform#483: a Team Environment never offers installing the Organization's content, so `team-01` is empty; it blocks `team-01` in L2 and the Team Environment onboarding scenario."
  - "The sign-in service: the first sign-in fails its name validation for some GitHub display names (parentheses or a single word); visitors and scenario 3 can hit it."
  - "The sign-in service and the Lazurio Dashboard: deleting or resetting a Lazurio account so that the same GitHub identity onboards as new, while usernames are never reassigned (0203 point 4); scenario 3 needs it (D29)."
  - "The Lazurio website: `try-01`'s terms of use and privacy pages on lazurio.ai, drafted for the Owner's approval and linked from `try-01`'s entry notice (D34)."
  - "The Lazurio Dashboard: removing the public-Organization mechanism built for `try-01`, which the Dashboard does not offer (D34)."
  - "The rollout pipeline's first run (moved to later on 2026-10-18, after its gateway install had to be recovered), after which the host lane's changes for `lazurio-bob`, `lazurio-alena`, `team-01` and `admin-01` are applied (D36)."
  - "The shared sign-in issuer outside the reference Organization: gateway clients for `lazurio-bob` and `lazurio-alena` and parking `admin-01`'s client, which the Owner approved on 2026-10-18 as an exception to 0204 point 7; applied once the Environments exist (D37)."
  - "The shared sign-in issuer outside the reference Organization: the gateway client `personal-lazurio-bob` of Bob's Personal Environment, which the Owner approved on 2026-10-21 as an exception to 0204 point 7 (D43); the rollout pipeline adds it with the next change of the issuer (task-2026-10-21-002)."
  - "The Lazurio Dashboard: binding `lazurio-bob`, `lazurio-alena` and `team-01` to their Teams in its registry, replacing `team-01`'s binding to Alena with Team `workspace`, and removing `admin-01` (D36, D37)."
  - "The Lazurio Dashboard: self-service creation and deletion of a Work Environment; today a new Environment is a Deployment Repo pull request through the rollout pipeline (root decision 0205)."
  - "Machines: no supported way to remove an Environment; a removed guest leaves leftovers on the host. Scenarios 1 to 3 need it."
  - "Machines: a public, SSO-only vault route behind the fail-closed Lazurio-login gateway, including `try-01`'s own vault account (D21, D32)."
  - "Machines and the Organization's Conglomerate Host: `try-01`'s vault is wiped every night as its own scheduled step; a rebuild alone does not wipe it (D35, task 016)."
  - "Machines and the AI provider: the server's services Machine `services-01` as a Work Environment only for Owners and Admins, with a container per service, carrying the public entry, the certificates and the capped AI gateway for `try-01` and replacing `edge-01` (CLIProxyAPI only, GPT-6 Luna only, an output cap per answer, reachable only from `try-01`; one gateway key for `try-01` renewed on reset; the provider key only in the service and in custody); a dedicated provider project paid by the maintainers' Organization that allows only that model with a hard monthly limit of 20 USD as the total cap, which the Owner set up himself; the maintainers' shared AI account must have all its sessions revoked and the paying organization's keys reviewed before the gateway starts. The services Machine program is tracked in the maintainers' plan (D34, D38, D39)."
  - "Lazurio/LazurioPlatform: `try-01`'s own Environment preset with the ordinary Platform release (D34): the demo onboarding, the entry notice that links the terms pages, anonymous content, the vault once `try-01` has its vault account, Integrations off, AI from the capped gateway with the chat model taken from the Environment's Codex configuration (D39), and agent instructions; the in-place guide's vault explanation has to fit a shared Environment and a vault reached through a Lazurio login (D32, Lazurio/LazurioPlatform#499)."
  - "A root decision addendum (HumanAndMachines/Lazurio#575, merged on 2026-10-18, tracked in the maintainers' plan): the Organization works as a standard Organization whose access GitHub defines; `try-01` is its one public Environment, entered by any signed-in Lazurio account only through its link, with no request, approval or membership and no Dashboard offer; its entry notice links its terms pages; its settings form its own preset; its only AI is GPT-6 Luna through the gateway with a 20 USD monthly cap; it has its own vault switched on, visible to everyone who enters and wiped every night (a departure from 0204 point 4 for `try-01` only); every visitor may sign in to their own GitHub and AI at their own risk; the `untrusted` network profile and the Dashboard's public-Organization flag return to normal paths; and people enter every Environment and the vault only through a Lazurio login, never the tailnet (a deviation from 0203 for this Organization once the public SSO-only vault route exists)."
  - "A general root decision and a second root decision addendum (HumanAndMachines/Lazurio#579, tracked in the maintainers' plan): one services Machine per server for every Organization (0209); in this Organization the public entry, the certificates and `try-01`'s AI gateway are services of `services-01` and `edge-01` goes; the gateway is CLIProxyAPI with the provider's 20 USD monthly limit as the total cap and an output cap per answer, with no daily budget; the chat model comes from the Environment's Codex configuration; the shared AI account of the maintainers is signed out of `try-01`, with the exposure open until all its sessions are revoked at the provider and the paying organization's keys are reviewed; until the gateway runs, `try-01` has no AI from the Organization (D38, D39)."
  - "The Organization's AI pool (root decision 0181) as a subscription service of `services-01`, for members only (D40); delivered with the services Machine in the maintainers' plan."
  - "Buddy on the web from the maintainers' Buddy work (DEV-6676): the bubble with its chat in Apps, Chat and Automate, the page context and Buddy's SSH reach into Work Environments (root decision 0210), through the ordinary LazurioPlatform, Machines and Buddy releases (parity); Bob's Personal Environment is its Ring 0 test bed (D42, task-2026-10-21-003)."
  - "Machines#760: a Conglomerate Host with the Organization's isolated DNS provider must accept a personal Machine, with DNS-01 for its personal label through a delegated `_acme-challenge` CNAME into the Organization's zone, in a Machines release after v0.12.188; until then Bob's Personal Environment gets no certificate, names or tailnet edge (D44)."
  - "`lazurio module create` in its Organization shape with `--data` (LazurioPlatform) for every new module."
  - "The rollout pipeline of root decision 0205 for every Machines apply of this Organization."
