risk_notes:
  - Every repository is public, so anyone can read every module on GitHub; restriction withholds only Write (D23).
  - Requiring a pull request ends the EX-0001 practice of fast-forwarding `main` to a green head, and a squash merge writes the merging account's email as the author (MIGRATION.md); the merge method must keep the noreply author.
  - With an approval required and two reviewing accounts, a broken automation or an exhausted AI pool stalls every merge. The Owner's break-glass is editing the ruleset, and every use is recorded.
  - A public vault route is a new attack surface; its gateway must fail closed, the penetration test covers it, and the vault holds no secret of the Organization, only fictional lab data (D21); `try-01`'s vault holds whatever visitors put in, which may be sensitive and stays visible to everyone in `try-01` until the independent nightly wipe (D35).
  - A rebuild wipes what visitors left in `try-01`, including sign-ins they forgot to remove.
  - "`try-01` admits any signed-in Lazurio account with its link permanently (D33, D34), so anyone may use it, including for abuse, and everyone who enters sees and may change its vault entries (root decision 0198 point 2); it holds no credential of the Organization, its vault holds no secret of the Organization and is wiped every night, and it is rebuilt from zero at will (0204 point 4)."
  - "`try-01` keeps its own preset permanently (D34), so it never tests exactly what other Organizations get; Ring 0 acceptance therefore relies on the members' Environments (`lazurio-bob`, `lazurio-alena` and `team-01`, D36)."
  - A rebuild of the server or of `try-01` does not wipe its vault, which lives on the Conglomerate Host; without the scheduled nightly wipe the items visitors left would stay for every later visitor (task 016).
  - A visitor may put a real password into `try-01`'s vault despite the entry notice; everyone who enters that day sees it until the nightly wipe (D35).
  - "Until 2026-10-19 a shared AI account of the maintainers was signed in on `try-01`. No API key had been stored there, but everyone who entered could read and copy its sign-in tokens until it was signed out; signing out removes only the local copy and revocation on sign-out is only best effort, so a copied token may still work. The exposure stays open until the account has all its sessions revoked at the provider and the paying organization's keys are reviewed; the gateway does not start before that (D38)."
  - "The provider's hard monthly limit is not enforced instantly, so recorded spend can slightly exceed 20 USD. The gateway has no daily budget, so one day can use up the whole month and `try-01` then has no AI until the month ends, which the Owner accepted (D39)."
  - "The public entry with its DNS key, the certificates and `try-01`'s AI gateway share one services Machine: containers separate load, not secrets, and an outage of `services-01` stops the entry to every Environment and `try-01`'s AI at once. Only the Organization's Owners and Admins enter `services-01` (D39)."
  - "One visitor can use up the month's limit and leave the others without AI until the month ends; with one shared gateway key the gateway cannot tell visitors apart (D39)."
  - Deleting Alena's Lazurio account is destructive; until the sign-in service can delete or reset an account so the same GitHub identity onboards as new, scenario 3 cannot run (D29).
  - Generated data with real-looking amounts could be mistaken for real people or companies; the generator uses reserved example domains and obviously fictional names (D27).
  - The lab finds gaps only while it runs routinely; a lab that is not exercised drifts away from what customers get.
  - "Bob's test device on the Organization's tailnet is the agents' headless client under maintenance access, reaching only Bob's Personal Environment on TCP 443. The exception holds only because Bob is a fictional test user; a real person never gets it and stays off the tailnet (D21, D44)."
  - "Buddy works with the full rights of Bob's Personal Environment (root decision 0210) and reaches `admin-01`, Bob's Admin Work Environment, over SSH inside the tailnet, a path that does not pass the Lazurio login. The penetration test of the login-only entry (scenario 7) covers entry from outside the tailnet, and `admin-01` holds nothing worth keeping (D11, D44)."
decisions:
  - date: 2026-10-18
    decision: "D11: The Organization becomes the Lazurio lab: a real, fully working Organization with correctly built modules, correct GitHub rights and Teams and real approval processes; it shows transparently how a Lazurio Organization works and is the pilot where migrations and rollouts are tested first (Ring 0, 0204 point 7). Nothing in it may be worth keeping: everything is public, invented and fictional, the whole server can be wiped and rebuilt, and the complete onboarding is run from scratch as a routine."
    rationale: The Owner, 2026-10-18.
  - date: 2026-10-18
    decision: "D12: Alena and Bob each have their own Work Environment where they live. Bob (`lazurio-bob`, Owner and Admin, Team `lazurio-bob`) keeps `admin-01` (renamed by D36: `lazurio-bob` replaces it). Alena (`lazurio-alena`, member) gets a new Work Environment (named `lazurio-alena` by D36) with her own closed per-person Team `lazurio-alena`, following the per-person pattern of the maintainers' own Organization. The Team Environment `team-01` (Team `workspace`) and the shared Environment `try-01` for invited people stay (D20 makes `try-01` the visitor Environment, without membership; D33 opens it to any signed-in Lazurio account)."
    rationale: The Owner, 2026-10-18.
  - date: 2026-10-18
    decision: "D13 (D42 and D44 update it on 2026-10-21: Bob's Personal Environment runs on the shared personal VM pool next to the other Personal Environments, as a node of the Organization's tailnet, instead of on the Buddy (Product 1) hosting; it is still never on the Organization's own server, and Alena still has none): Bob has a Personal Environment with Buddy and Alena has none, so the interface can be studied with and without a personal space. Bob's Buddy runs on the normal Buddy (Product 1) hosting like any customer's, never on the Organization's own server (0204 point 9)."
    rationale: The Owner, 2026-10-18.
  - date: 2026-10-18
    decision: "D14 (D40 replaces the fixed monthly cap of its last sentence with a subscription pool on `services-01`): Alena's and Bob's Work Environments run automations (the Automate tab, Lazurio MausBot) that review and approve pull requests as `lazurio-alena` and `lazurio-bob`, the way the maintainers' own Organization runs its review persona. Their AI comes from the Organization's own AI pool with a fixed monthly cap, the normal mechanism of root decision 0181 for members. Invited people never get it."
    rationale: The Owner, 2026-10-18.
  - date: 2026-10-18
    decision: "D15: People reach the Organization, including its Conglomerate Host, only through a Lazurio login, never through the tailnet. Server management stays on the host's own tailnet (runner, rollout gateway, admin SSH), as in other Organizations. D21 settles the vault."
    rationale: The Owner, 2026-10-18.
  - date: 2026-10-18
    decision: "D16: From client Organizations only the shape of a module is taken: archetype, stack, structure and realistic data volume. The code is written new with a fictional domain. Code may be reused only from modules the Lazurio maintainers' own Organization owns, cleaned of its business data. Client code and data are never copied, and no client Organization or module is named in this Organization."
    rationale: The Owner, 2026-10-18; root rule on cross-Organization isolation.
  - date: 2026-10-18
    decision: "D17: Access comes in permutations. Bob (Admin) reaches every module; Alena's access is restricted (for example no finance module, read only on some), so the profile and the Apps can be seen with restricted modules. Every module without an App gets one, so load times can be measured and benchmarked before and after platform optimizations. D23 defines restricted and D24 keeps playbooks App-less."
    rationale: The Owner, 2026-10-18.
  - date: 2026-10-18
    decision: "D18: Modules move to current best practice: the Lazurio Module Standard (root decision 0171), App generation v3, data on repository-db, and creation through the normal creation path (`lazurio module create` or the Dashboard's new-module dialog), which tests that path too."
    rationale: The Owner, 2026-10-18.
  - date: 2026-10-18
    decision: "D19 (state recorded on 2026-10-18): one real external person, the Owner's demo guest, was invited and was an active member of Team `workspace`; he was removed again at 13:32 UTC the same day (D20). Who has access is listed only in the Dashboard (0204 addendum of 2026-10-17). `try-01` has the Organization's content, downloaded on 2026-10-18; `team-01` has none (Lazurio/LazurioPlatform#483), which blocks the Team Environment onboarding scenario."
    rationale: The Owner, 2026-10-18.
  - date: 2026-10-18
    decision: "D20 (answers Q10; D33 supersedes the visitor mechanism of (b), the member face (a) stands): The lab has two faces. (a) Members: members of the GitHub Organization, that is the Lazurio maintainers and the test accounts Bob and Alena, reach Bob's and Alena's Work Environments and `team-01`; these are never public, and visitors never become members. (b) Visitors: people from outside, for example a prospect, reach only `try-01`. They ask to try Lazurio in the Lazurio Dashboard, an Admin approves, and the Dashboard then shows them `try-01` to click into instead of a link being sent; `try-01` has its own account in the vault. The approval gives access to `try-01` only, with a Lazurio login: native Lazurio membership in the sign-in service and an exact grant on `try-01`, the native model of root decision 0192 that the sign-in service is qualifying, never GitHub membership or a Team, and not a Dashboard list read by the gateway. Becoming a real member (an own Environment, a GitHub invitation) stays ordinary colleague onboarding. Until the grant is wired, `try-01` stays on `public-account` exactly as today and is reached by a direct link; the Dashboard's request form and its approve, decline and revoke lists ship first and enforce nothing yet. Team `guests` is dropped: the invited guest was removed from the Organization and the Team deleted on 2026-10-18 at 13:32 UTC. This corrects the 0204 addendum of 2026-10-17 afternoon, point (b), from a GitHub invitation and a closed Team to native Lazurio membership and a grant on the shared Environment (0192), with the shared Environment open to any signed-in account until that is ready, and departs from 0204 point 4 (no vault for visitor Environments); a root addendum records it (dependencies)."
    rationale: "The Owner, 2026-10-18 about 13:30 UTC (\"I don't want him to be part of the organization where we test things, only to have access to the public Environment.\") and about 13:45 UTC (two faces, Dashboard invitation, own vault account for `try-01`), and the same afternoon on the mechanism (access to `try-01` only with a Lazurio login, native membership and an exact grant, never GitHub)."
  - date: 2026-10-18
    decision: "D21 (answers Q1; D43 and D44 keep it for people and add Machines on 2026-10-21: for Buddy's Ring 0 test, Bob's Personal Environment joins the tailnet as a node and his Work Environment `admin-01` as a server node, and the agents' headless client acts there as Bob's test device, a Ring 0 exception for a fictional test user): no tailnet for people anywhere in the Organization. Neither the vault nor the entry to any Environment needs the tailnet; everything goes through the Lazurio login. The purpose is penetration testing: prove that nothing gets in without the login. Server management may stay on the host's tailnet. This needs a public, SSO-only vault route in Machines behind the fail-closed Lazurio-login gateway, including `try-01`'s own vault account, and a root addendum: a deviation from 0203 for this Organization and a 0204 note that the whole Organization is tailnet-free for people."
    rationale: The Owner, 2026-10-18 about 13:45 UTC.
  - date: 2026-10-18
    decision: "D22 (answers Q2; since D42 Bob's Personal Environment is created on the shared personal VM pool through the Organization's lanes instead of as a Buddy (Product 1) Base plan, and its cost stays with the maintainers' own Organization): Bob's Buddy (Base plan) is paid by the Lazurio maintainers' own Organization. Agents operating Bob's fictional Personal Environment with test credentials is fine: Bob is fictional, so there is no conflict with the Personalspace rule (0091)."
    rationale: The Owner, 2026-10-18 about 13:45 UTC.
  - date: 2026-10-18
    decision: "D23 (answers Q3): restricted means that Alena reads those modules but cannot write them (no Write grant); Bob writes everything. Read stays public."
    rationale: The Owner, 2026-10-18 about 13:45 UTC.
  - date: 2026-10-18
    decision: "D24 (answers Q4): playbooks stays deliberately App-less, to show how the Launchpad presents a document-only module. It is the one exception to D17."
    rationale: The Owner, 2026-10-18 about 13:45 UTC.
  - date: 2026-10-18
    decision: "D25 (answers Q5; proposed default, the Owner may override): `automations` holds the definitions of Alena's and Bob's review automations, with a small read-only App."
    rationale: Proposed default of 2026-10-18; the Owner may override it.
  - date: 2026-10-18
    decision: "D26 (answers Q6; proposed default, the Owner may override): research folds into experiments."
    rationale: Proposed default of 2026-10-18; the Owner may override it.
  - date: 2026-10-18
    decision: "D27 (answers Q7; succeeds EX-0001 D7 for prices): the lab uses realistic fictional data with real-looking amounts and prices, because the whole point is fictional data. Numbers may look real; they must stay invented. D7's placeholder rule no longer binds new data."
    rationale: The Owner, 2026-10-18 about 13:45 UTC.
  - date: 2026-10-18
    decision: "D28 (answers Q8; its cap and place are replaced by D40): the AI pool is paid by the Lazurio maintainers' own Organization. Proposed default (the Owner may change the amount): a monthly cap of 50 USD, with the pool running in Bob's Work Environment."
    rationale: The Owner, 2026-10-18 about 13:45 UTC (payer); cap and place proposed as a default.
  - date: 2026-10-18
    decision: "D29 (answers Q9): no third test account. The onboarding-from-scratch scenario deletes Alena completely, her Environment and her Lazurio account, and lets her sign in again and onboard under her own account. It depends on the sign-in service being able to delete or reset an account so that the same GitHub identity can onboard as new, since usernames are never reassigned (0203 point 4)."
    rationale: The Owner, 2026-10-18 about 13:45 UTC.
  - date: 2026-10-18
    decision: "D30 (answers Q11; proposed default, the Owner may override): add Team `sales`, which shares the sales modules with `workspace` to show N:M module membership."
    rationale: Proposed default of 2026-10-18; the Owner may override it.
  - date: 2026-10-18
    decision: "D31 (answers Q12; proposed default, the Owner may override): Deployment Repo pull requests keep the reference Organization's rollout rule of root decision 0205 (addendum of 2026-10-17, point e): no persona review and no click."
    rationale: Proposed default of 2026-10-18; the Owner may override it.
  - date: 2026-10-18
    decision: "D32 (answers Q15): `try-01` keeps its own vault account and shows the vault like any Environment of an Organization. A visitor opens the vault from Apps, sees what other visitors put in since the last nightly wipe and can add an item (D35: the vault is simply on and wiped every night, with no prepared entries), and the in-place guide explains how the vault works: the question mark next to the page title and the guide bubble at the bottom right, which without a Buddy shows the neutral Lazurio guide. `try-01` is where visitors learn how Lazurio works, so the guide matters most there. It reaches `try-01` with the ordinary Platform release, as in every Organization (parity, no code path only for the lab). If the standard guest Environment keeps a guest onboarding without a vault, `try-01` still keeps its vault account (D33 shelves the standard guest Environment)."
    rationale: "The Owner, 2026-10-18 about 14:00 UTC: the guide bubble is how people learn how Lazurio works, so visitors must be able to open the vault in `try-01` and have the bubble explain it."
  - date: 2026-10-18
    decision: "D33 (simplifies D20 (b)): `try-01` is the Organization's only public Environment, and no Environments for individual visitors are built; the Owner names this the defining fact of the visitor face. `try-01` is a special Environment of this Organization under root decision 0204 and not a standard mechanism for other Organizations. Any signed-in Lazurio account enters it with its link (the `public-account` admission, as today, permanently), with no invitation, access request, approval, native membership or grant, and a visitor never becomes a member of the GitHub Organization, a Team or the sign-in service. `try-01` keeps its own vault account (D32); the safe contract first recorded here is replaced by D35. The standard guest Environment for every Organization is shelved (HumanAndMachines/Lazurio#576). Otherwise the Organization works as a standard Organization: GitHub defines access (membership, Teams and grants), by which the Lazurio maintainers and the test accounts enter Alena's and Bob's Work Environments and `team-01`, where the maintainers test and benchmark Environments; a new member is added by an ordinary GitHub invitation. The lab's one exception stays D21: people enter every Environment and the vault only through a Lazurio login, never the tailnet, and server management stays on the Organization's own tailnet. How visitors reach `try-01`, its settings and its AI are set by D34. A root addendum records both (HumanAndMachines/Lazurio#575)."
    rationale: "The Owner, 2026-10-18 about 14:15 UTC: `try-01` is the one Environment anyone may try with a Lazurio account, with no invitation or approval; everything else in the lab follows the standard Organization path. About 15:20 UTC he confirmed: “Separate Environments for individual visitors are not built, because try-01 is the only public Environment. That seems to me a defining fact.”"
  - date: 2026-10-18
    decision: "D34 (refines D33; D39 moves the gateway of (c) from `edge-01` to a service of `services-01` and replaces its per-session token cap with the provider's monthly limit and an output cap per answer; D38 signs the shared AI account out of `try-01`; D41 shapes the preset of (b) and removes GitHub from the own sign-ins of (a)): (a) Link only (about 14:30 UTC). `try-01` is reached only through its link; the Lazurio Dashboard does not offer it, and the Dashboard's public-Organization mechanism built for it is removed. Its entry notice links `try-01`'s terms of use and privacy pages on lazurio.ai and says that continuing means accepting them. An access request stays a general Dashboard feature for new members of real Organizations, found through a join link the Owner shares and followed by the ordinary GitHub invitation; it is not used for `try-01`. Every visitor may sign in to their own GitHub account and their own AI subscription in `try-01` at the risk of the shared session and signs out after use; the Organization gives `try-01` only read access on GitHub. (b) Own preset (about 14:55 UTC). `try-01`'s settings form its own Environment preset (working name Try, which may change), separate from the Work and Team presets: the demo onboarding without the AI-first step, the entry notice, reading the Organization's public content without a GitHub identity (`entry.audience: public`, Lazurio/LazurioPlatform#472), the vault once `try-01` has its own vault account (D32, D35, Lazurio/LazurioPlatform#499), Integrations off (0204 point 4), AI from the Organization's capped gateway, and agent instructions so the chat agent can explain what this Environment and Lazurio can do. The `public-account` admission stays; the `untrusted` network profile returns to normal, as `try-01` has full ordinary web access. (c) AI (about 15:00 UTC). The only AI the Organization gives in `try-01` is the model GPT-6 Luna (`gpt-6-luna`) through the Organization's gateway on `edge-01`: a dedicated provider project paid by the maintainers' Organization allows only this model and has a hard monthly spend limit of 20 USD, after which the provider refuses requests (HTTP 429), and the gateway also pins the model and caps tokens per session. `try-01` gets one gateway key, renewed on every reset; the provider key lives only on `edge-01` and in custody, never in `try-01` or Git. Creating the provider project, its limits and the key is a billing step the Owner does himself. This is the capped gateway root decision 0204 point 6 foresees; visitors never get the members' AI pool (D14)."
    rationale: "The Owner, 2026-10-18: about 14:30 UTC (link only, no Dashboard offer, access requests only for real Organizations), about 14:55 UTC (own preset and capped AI) and about 15:00 UTC (GPT-6 Luna only, 20 USD a month)."
  - date: 2026-10-18
    decision: "D35 (simplifies the vault part of D32 to D34): `try-01`'s own Environment vault is simply switched on (a technical account in the Organization's Vaultwarden), so visitors can try how the vault works; it is not the Organization's vault for people's passwords (root decision 0203 point 3). Everyone who enters `try-01` sees and may change its items (root decision 0198 point 2), and the entry notice says so. The Organization puts no secret of its own into it, and it is wiped every night. The earlier safe contract (only entries an Admin puts in, no password saving from the Environment's browser, a prepared set restored on reset) is dropped. A rebuild of the server or of `try-01` does not by itself wipe the vault, which lives on the Organization's Conglomerate Host, so the nightly wipe is its own scheduled step (task 016)."
    rationale: "The Owner, 2026-10-18 about 15:20 UTC: “Let’s not complicate the vault in try-01. I would simply switch the vault on and wipe it every night.”"
  - date: 2026-10-18
    decision: "D36 (the members' Environments; D44 (a) keeps `admin-01` as Bob's Work Environment and creates no `lazurio-bob`, which the Owner settles in Q16): `try-01` stays the public Environment for trying Lazurio, unchanged. `lazurio-bob` is Bob's Work Environment as Admin (root decision 0202), signed in to GitHub with Bob's own account and admitting Team `lazurio-bob`; it replaces `admin-01`, which is migrated and then retired, and because the lab is disposable it starts fresh. `lazurio-alena` is Alena's Work Environment as an ordinary member, signed in to GitHub with her own account and admitting Team `lazurio-alena`; it replaces the working name `alena-01`. `team-01` becomes a real Team Environment like those of other Organizations: its GitHub identity is the Organization's brokered identity Lazurio for GitHub, and it is disconnected from Alena's account. The maintainers' Ring 0 release tests run on `lazurio-bob` (admin), `lazurio-alena` (user) and `team-01` (team); the public tries `try-01`. The host lane declares the changes and the rollout pipeline applies them after its first run (tasks 003 and 004), and `admin-01` is retired only after `lazurio-bob` is verified (task 018); an Admin creates Team `lazurio-alena`; the gateway clients of the new Environments at the shared sign-in issuer outside the reference Organization need the Owner's explicit approval; `admin-01`'s VM keeps running unmanaged until Machines supports removing an Environment or the Owner approves destroying it (D37 settles these points)."
    rationale: "The Owner, 2026-10-18 about 16:20 UTC: “try-01 for the public to try, as we have it today; lazurio-bob as Bob's working admin Environment, signed in with Bob's GitHub; lazurio-alena as Alena's working Environment, signed in with Alena's GitHub; team-01 as the working Team Environment, signed in to GitHub as the Lazurio for GitHub bot, as usual. I would retire admin-01, or rather migrate it as lazurio-bob; I would disconnect team-01 from Alena's account and make it a real Team Environment, and give Alena her own Work Environment. Our release testing then runs on lazurio-bob (admin Environment), lazurio-alena (user Environment) and team-01 (Team Environment). We share try-01 with the public to try.”"
  - date: 2026-10-18
    decision: "D37 (settles the open points of D36): `lazurio-bob` and `lazurio-alena` are the first real rollouts of the rollout pipeline, with no manual apply from an operator's computer; the pipeline's first run moved to later on 2026-10-18, after its gateway install on the Organization's Conglomerate Host had to be recovered. An Admin created Team `lazurio-alena` (closed, Alena only, no repository grants; like `lazurio-bob`, it only gates entry). The Owner approved, as the only exception to 0204 point 7 for this change, adding the gateway clients of `lazurio-bob` and `lazurio-alena` at the shared sign-in issuer outside the reference Organization and parking `admin-01`'s client. The Owner approved destroying `admin-01`'s VM and the old `try-01`'s VM once `admin-01` is migrated to `lazurio-bob` and unreachable, without waiting for Machines to support removing an Environment. `team-01`'s GitHub tool already acts as the brokered identity; the impression that it was signed in with Alena's account most likely comes from the Dashboard's registry binding it to Alena, which the binding to Team `workspace` replaces, and a browser session of Alena's GitHub account in `team-01`, if any, is signed out."
    rationale: "The Owner, 2026-10-18 about 17:00 UTC, answering the open points of D36; the state of the pipeline and of `team-01` as found the same evening."
  - date: 2026-10-19
    decision: "D38 (refines D34 (c); its placement (a) and its limits (b) are replaced by D39 on the same day, its sign-out (c) stands, and D40 closes the exposure of (c)): (a) Own services Machine. The AI gateway for `try-01` runs on its own services Machine on the Organization's dedicated server, separate from the entry Machine `edge-01`. `edge-01` is the entry to every Environment of the Organization and holds the key that changes its DNS records; a gateway that every signed-in Lazurio account can load must not, when overloaded or abused, stop the entry to the other Environments or reach the DNS key. Only `try-01` may reach the gateway. Root decision 0204 point 9 still has one service Machine for the public entry; one more service Machine exists only for `try-01`'s AI gateway. (b) Limits. The provider stays a dedicated project that allows only GPT-6 Luna and has a hard monthly limit of 20 USD. Because `try-01` is one shared Environment with one gateway key, the gateway limits `try-01` as a whole, not individual visitors: a daily budget of about one thirtieth of the monthly limit (about 0.67 USD a day), so a single day cannot use up the month; an output-token cap per answer (at most 8k tokens); about 20 requests a minute; and at most 2 concurrent requests. These replace the per-session token cap of D34. The provider key lives only on the services Machine and in custody, never in `try-01` or Git; `try-01` has its own gateway key, renewed when `try-01` is reset. Visitors still never get the members' AI pool (D14). (c) Shared AI account signed out. The shared AI account of the maintainers was signed out of `try-01` on 2026-10-19 at 05:39 UTC, not in the rollout that starts the gateway: the account also owns the provider organization that pays for the gateway, and any visitor could copy its sign-in. No API key had been stored in `try-01`, but everyone who entered could read its sign-in tokens until then. Signing out in `try-01` does not by itself guarantee that tokens someone copied stopped working, because revocation on sign-out is only best effort. The exposure therefore stays open until the maintainers' shared AI account has all its sessions revoked at the provider and the paying organization's keys are reviewed, keeping only the gateway's key; the gateway does not start before the Owner confirms both. Until the gateway runs, `try-01` has no AI from the Organization; a visitor may still sign in their own AI subscription at the risk of the shared session (D34 (a)). Root decision 0204's addendum of 2026-10-19 records this (HumanAndMachines/Lazurio#579)."
    rationale: "The Owner, 2026-10-18 late evening (sign the shared account out now, not at the gateway's start) and 2026-10-19 (own services Machine and the limits); the sign-out was done on the host on 2026-10-19 at 05:39 UTC."
  - date: 2026-10-19
    decision: "D39 (corrects D38 (a) and (b)): (a) One services Machine. The Organization's public entry without a tailnet, its certificates and `try-01`'s AI gateway become services of a single services Machine `services-01` on the Organization's dedicated server, each in its own container with memory, CPU and process limits; `edge-01` goes once they have moved. This follows the general rule of the Lazurio maintainers for every Organization's server (root decision 0209): each server has exactly one services Machine, numbered after the server and shown to people as the server's services; it is a Work Environment only for the Organization's Owners and Admins, it is enlarged rather than multiplied, and its containers separate load, not secrets. Only `try-01` may reach the AI gateway. (b) Gateway. The gateway uses only CLIProxyAPI with the key of the dedicated provider project, which allows only GPT-6 Luna and whose hard monthly limit of 20 USD is the total cap; CLIProxyAPI pins the model and caps the output of each answer. There is no daily budget and no request limit: one day can use the whole monthly limit, after which `try-01` has no AI until the month ends, which the Owner accepted. These replace D38's own services Machine and its four limits. (c) Model. The chat in `try-01` takes its model from the Environment's Codex configuration, not from a new Organization setting. (d) D38 (c) stands: the gateway does not start before the shared account's sessions are revoked at the provider and the paying organization's keys are reviewed. The root decision addendum of 2026-10-19 to 0204 records (a) to (c) (HumanAndMachines/Lazurio#579)."
    rationale: "The Owner, 2026-10-19: one general rule for every Organization's server instead of a separate Machine for each case; the public entry and `try-01`'s AI gateway move into it."
  - date: 2026-10-20
    decision: "D40 (closes the exposure of D38 (c); replaces the cap and place of D28 and the fixed monthly cap of D14): (a) Exposure closed. The Owner signed out the device that had been signed in to `try-01` and, from the list of the shared AI account's sessions at the provider, had the chosen sessions signed out one by one, including the one other session from this Organization's server; the paying provider organization holds only the gateway's key. Root decision 0204 records the exposure as closed (HumanAndMachines/Lazurio#588), so `try-01`'s gateway starts together with the services Machine (D39). (b) Members' AI pool. The members' AI pool is a standard subscription pool, a service of `services-01` (root decision 0209), with two test subscription accounts the Owner signs in, paid by the maintainers' own Organization. It replaces D28's monthly cap of 50 USD and its place in Bob's Work Environment. Only the members' Environments are granted it: today `admin-01` and `team-01`, and `lazurio-bob` and `lazurio-alena` when they replace `admin-01`. The accounts' sign-ins stay in the pool service and in custody, never in Git or in a member Environment. `try-01` never gets the pool (0204 point 6); its visitors get only GPT-6 Luna through the gateway."
    rationale: "The Owner, 2026-10-19 evening and 2026-10-20 (the account check; option B for the members' pool)."
  - date: 2026-10-20
    decision: "D41 (shapes D34 (b); removes GitHub from the own sign-ins of D34 (a)): (a) Preset. `try-01`'s own preset is a fixed setting of the public Environment: one named record (working name Try) selected only by the single switch, the gateway's `public-account` admission projected to the hand-over's `entry.audience: public`. It is never recorded, chosen or changed; Settings shows it as one fixed option, and people still see a Team Environment with a qualifier, never a fourth kind. It holds the demo onboarding, the entry reminder with the terms links, no GitHub identity, Integrations withheld, the vault following the vault core, and the visitors' agent instructions. (b) GitHub. Signing in to an own GitHub account is not available in `try-01`, because all visitors share one account with full rights and could take over each other's GitHub session; the Environment browser already blocks it. Visitors may still sign in to their own AI and other accounts at the risk of the shared session and sign out after use; the terms of use get a new version. (c) Accepting the terms. Continuing through the entry notice accepts the current terms; acceptance is not recorded anywhere. The sign-in record stays in `try-01` and is wiped with it. Root decision 0204 records the same (addendum of 2026-10-20 afternoon)."
    rationale: "The Owner, 2026-10-20, choosing the recommended answers of the try-01 preset shaping study (variant C, GitHub blocked, no acceptance record)."
  - date: 2026-10-21
    decision: "D42 (updates D13 and D22): Bob gets a Personal Environment now, for testing. It runs on the shared personal VM pool next to the other Personal Environments, never on the Organization's own server (0204 point 9). It is the Ring 0 test bed for Buddy on the web (root decision 0210): the bubble with its chat, the page context and Buddy's SSH reach into Bob's Work Environment. Alena gets no Personal Environment, so the interface is also tested without one: her bubble shows the neutral Lazurio guide (root decision 0210, D13)."
    rationale: "The Owner, 2026-10-21 about 19:30 UTC, answering a question of the maintainers' Buddy work (DEV-6676) with the question tool: “Let’s make Bob’s personal Example Environment (the normal way, on the Proxmox server with the other personal Environments), which will serve for testing. Alena will not have a personal Environment.”"
  - date: 2026-10-21
    decision: "D43 (updates D21; approves a client as D37 did): (a) Bob's Work Environment joins the Organization's tailnet only as a server node, so that Buddy's SSH reach is tested on Ring 0. People stay off the tailnet and keep entering with a Lazurio login; D21 is unchanged for them. (b) The gateway client `personal-lazurio-bob` of Bob's Personal Environment at the shared sign-in issuer outside the reference Organization is approved, as an exception to 0204 point 7 like the clients of D37."
    rationale: "The Owner, 2026-10-21 about 20:20 UTC, with the question tool: “Yes, only as a server” and “Yes, I approve”."
  - date: 2026-10-21
    decision: "D44 (the rollout pipeline owner's decisions for D42 and D43; (a) departs from D36, Q16): (a) Bob's Work Environment is `admin-01`, as the pipeline owner reads the Owner's decision of 2026-10-18 (D12: Bob keeps `admin-01` with Team `lazurio-bob`), and no new `lazurio-bob` Work Environment is created, because a second guest would only duplicate Bob's Work Environment. D36 instead replaces `admin-01` by a new `lazurio-bob` (tasks 003, 004 and 018). Until the Owner settles Q16, `admin-01` is Bob's Work Environment and the server node of D43, and those tasks stay as they are. (b) Network. Bob's Personal Environment is a node of the Organization's tailnet under Bob's personal tailnet user (root decision 0154), and `admin-01` joins it as a server node. The grants: Bob's test device to the Personal Environment on TCP 443, and the Personal Environment to `admin-01` on TCP 22 (root decision 0155). As a node of the Organization's tailnet, Bob's Personal Environment is managed through the Organization's Deployment Repo and pipeline (root decision 0155, addendum of 2026-10-20). (c) Test device. The agents' headless tailnet client acts as Bob's test device, under the Conglomerate Host's `maintenance_access` on TCP 443 only. This Ring 0 exception holds only because Bob is a fictional test user and is never used for a real person; the Personal Environment's gateway still admits only Bob's Lazurio login. (d) Certificates. DNS-01 for the personal label goes through a delegated `_acme-challenge` CNAME into the Organization's zone, written by the path that owns `lazurio.io`, never by the host (Machines#760, in a Machines release after v0.12.188). (e) Lanes. In the private Deployment Repo: LazurioExampleOrganization/machines#82 (Bob's personal lane), #83 (the Conglomerate Host lane: Bob's personal tailnet user, the Personal Environment's node, its maintenance access and the grants), and `admin-01`'s tailnet enrollment on the host lane `proxmox-01`. (f) Window. After Thursday's demo, on Thursday evening 2026-10-22 or Friday 2026-10-23, behind the Ring 0 slots already queued. The first creation runs from the operator's computer; later changes go through the Organization's pipeline."
    rationale: "The rollout pipeline owner (DEV-6671), 2026-10-21 about 20:20 UTC, deciding the lanes of D42 and D43; its decision record is a comment on LazurioExampleOrganization/machines#83."
