    priority: high
    priority_rank: 63
    assignee: Example thread
    priority_decider: organization-admin
    priority_reason: "Alena needs a place to live, Bob's Environment needs its target name and `team-01` must act as the Organization rather than as Alena before the automations, the restricted profile, scenario 2 and the Ring 0 release tests can run."
