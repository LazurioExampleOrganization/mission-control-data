context: |
  Lazurio Example Organization is Lazurio's public reference Organization (root
  decision 0204): fictional data, public repositories, its own dedicated server,
  entry to its Environments with a Lazurio login and no tailnet, and the first
  wave (Ring 0) of every Lazurio rollout. Plan EX-0001 migrated it from a cleaned
  GEN2 snapshot to GEN3; only its fresh install and close-out (A1) remain.

  On 2026-10-18 the Owner decided what comes next: the Organization becomes the
  Lazurio lab. It must be a real, fully working Organization with correctly built
  modules, correct GitHub rights and Teams, and real approval processes. It shows
  transparently how a Lazurio Organization works, and it is the pilot where
  migrations and rollouts are tested first.

  Nothing in it may be worth keeping. Everything is public, invented and
  fictional; the whole server can be wiped and rebuilt and nothing of value is
  lost. That is what makes it a lab: the complete onboarding can be run from
  scratch as a routine, for example by deleting Alena's Work Environment and
  adding it again through the Dashboard, or by deleting Alena completely and
  letting her onboard again.

  The lab has two faces (D20). Members of the GitHub Organization, the Lazurio
  maintainers and the test accounts Bob (`lazurio-bob`, Owner and Admin) and
  Alena (`lazurio-alena`, member), work in Environments that are never public.
  Visitors from outside, such as a prospect, reach only `try-01`, the
  Organization's one public Environment, which any signed-in Lazurio account
  opens through its link (D33, D34), and never become members of the GitHub Organization. Agents sign in as Bob and Alena to verify
  in a browser every change a person meets (root decision 0178). The fictional
  characters of the business data stay those of EX-0001 D3: Alex Morgan, Sam
  Taylor, Robin Lee and Kim Park.

  The Owner answered the plan's open questions on 2026-10-18 (D20 to D32) and
  simplified the visitor path the same afternoon (D33, D34). On 2026-10-19 the
  shared AI account of the maintainers was signed out of `try-01` (D38), and the
  Owner placed the public entry, the certificates and `try-01`'s AI gateway as
  services of one services Machine `services-01` on the Organization's server,
  which replaces `edge-01` (D39, correcting D38). On 2026-10-21 the Owner made a
  Personal Environment for Bob on the shared personal VM pool the Ring 0 test
  bed for Buddy on the web, and let Bob's Work Environment join the
  Organization's tailnet as a server node only, so that Buddy's SSH reach is
  tested too; people stay off the tailnet (D42 to D44).
  Decisions marked "proposed default" stand unless the Owner overrides them.
current_problem: |
  State of 2026-10-18. The Organization is migrated but does not yet work like a
  company.

  - Modules. Of seven workspace modules only the knowledgebase has an App
    (generation v2); research, experiments, playbooks, automations, content and
    finance have none. The root applications are the design system and Mission
    Control v3 with its data repository. No business App keeps its data on
    repository-db, no restricted module has an App, and there is nothing to
    measure load times against.
  - People and rights. The Teams are `workspace` (closed; Write on the workspace
    modules except finance, and on the root application repositories) and the
    per-person `lazurio-bob` (no grants; Bob is an Owner). Alena is in
    `workspace` and, since 2026-10-18, in her closed per-person Team
    `lazurio-alena` (no grants; like `lazurio-bob`, it only gates entry). The
    members are a Lazurio
    maintainer and the two test accounts. Rulesets forbid deletion and force
    pushes and require CI where it exists; nothing requires a pull request, an
    approval or a code owner. The remaining governance questions are open in
    infra#2.
  - Environments. The dedicated server runs the public entry `edge-01`, Bob's
    Work Environment `admin-01`, the Team Environment `team-01` (Team
    `workspace`) and the visitor Environment `try-01`, reached by a direct link
    and open to any signed-in Lazurio account (the `public-account` admission).
    `try-01` has the Organization's content since 2026-10-18; `team-01` has
    none, because a Team Environment never offers installing the Organization's
    content (Lazurio/LazurioPlatform#483). Its GitHub tool already acts as the
    Organization's brokered identity, but the Lazurio Dashboard's registry
    binds it to Alena's account instead of Team `workspace`. Alena has no
    Environment of her own, and nobody has a Personal Environment.
  - Visitors. Any signed-in Lazurio account that has the link opens `try-01`,
    and that stays (D33, D34). `try-01` does not yet have its own preset, AI
    gateway or vault account, and its entry notice does not yet link its terms
    of use and privacy pages. Until the gateway runs, `try-01` has no AI from
    the Organization: the shared AI account of the maintainers that was
    signed in there was signed out on 2026-10-19 (D38).
  - Processes. No automation reviews pull requests and members get no AI.
  - Vault. The Organization's vault on its Conglomerate Host answers only
    inside the Organization's tailnet (root decision 0203), while people must
    reach the Organization only through a Lazurio login.
  - Repeatability. The complete onboarding cannot be run again on demand:
    Machines has no supported way to remove an Environment, the Dashboard
    cannot create or delete one by self-service, and a Lazurio account can be
    neither reset nor deleted so that the same GitHub identity onboards as new
    (a username is never reassigned, root decision 0203 point 4).
target_state: |
  Outcome: the Organization works like a small real company on Lazurio, with
  two faces (D20).

  - Members. Bob lives in his Work Environment as Admin (`lazurio-bob` by D36,
    or `admin-01` by D44; Q16) and also has a Personal Environment with Buddy
    on the shared personal VM pool, a node of the Organization's tailnet and
    the Ring 0 test bed for Buddy on the web (D42, D44).
    Alena lives in her own Work Environment `lazurio-alena` and has no Personal
    Environment. Team `workspace` works in `team-01`, a real Team Environment
    whose GitHub identity is the Organization's brokered identity Lazurio for
    GitHub. The maintainers' Ring 0 release tests run on these three (D36). These Environments are reached only by members of the
    GitHub Organization (the Lazurio maintainers and the test accounts) and are
    never public. GitHub defines who enters them (membership, Teams and
    grants), as in every Organization, and a new member is added by a GitHub
    invitation.
  - Visitors. `try-01` is the Organization's one public Environment (D33).
    Any signed-in Lazurio account opens it, only through its link; the Lazurio
    Dashboard does not offer it, and there is no invitation, request,
    approval, membership or grant. A visitor never becomes a member of the
    GitHub Organization, a Team or the sign-in service. The entry notice links
    `try-01`'s terms of use and privacy pages, its settings form its own
    Environment preset, its chat agent runs on GPT-6 Luna through the
    Organization's capped gateway, and its own vault is on for everyone who
    enters and wiped every night (D32 to D35).
  - Every archetype found in real Organizations is present once, with a
    fictional domain: knowledgebase, public website, design system, business
    data Apps on repository-db, React Apps without data, one deliberately
    App-less document module and Mission Control v3. Modules follow the Lazurio
    Module Standard, Apps are on generation v3, data lives on repository-db,
    every new module came through the normal creation path, and generated data
    is realistic, with real-looking but invented amounts.
  - Rights follow from Teams; one public matrix says who reaches which module
    with which right. Alena reads the restricted modules but cannot write them;
    Bob writes everything. Every public repository requires a pull request, an
    approval and CI, and forbids force pushes and deletion.
  - Bob's and Alena's Work Environments run automations that review each
    other's pull requests as their accounts; Bob merges. Data is published with
    the "Publish changes" button. Fictional business approval rules live in the
    playbooks.
  - The lab scenarios (rebuild from zero, delete and re-add an Environment,
    deleting Alena completely and onboarding her again, a visitor's path,
    restricted versus full profile, with and without a personal space, a
    penetration test of the login-only entry, Ring 0 acceptance) have public
    runbooks and run routinely as Bob and Alena.
  - Every App has load metrics measured the same way each release in a public
    benchmark ledger.

  Fixed boundaries:

  - Nothing worth keeping: only fictional data and public repositories (the
    private Deployment Repo is the one exception, 0204 point 8), no backup, and
    any Environment or the whole server can be rebuilt from zero at any time.
  - No client code: from client Organizations only the shape of a module is
    taken (archetype, stack, structure, realistic data volume). Code is written
    new, or reused only from modules the Lazurio maintainers' own Organization
    owns, cleaned of its business data. This plan names no client Organization
    or client module.
  - Parity: the same code paths as every Organization (0204 addendum of
    2026-10-17). The lab differs only in settings: no tailnet for people (D21)
    and `try-01`'s own Environment preset under root decision 0204 (D34). A
    gap it finds is fixed in Lazurio for everyone.
  - No tailnet for people anywhere in the Organization (D21): every
    Environment, the vault and `try-01` are reached only through a Lazurio
    login, and a penetration test proves that nothing gets in without it. The
    tailnet manages the servers (runner, rollout gateway, admin SSH) and, for
    Buddy's Ring 0 test, carries Bob's Personal Environment as a node and his
    Work Environment as a server node (D43, D44); the agents' headless client
    acts there as Bob's test device, reaching only the Personal Environment on
    TCP 443, a Ring 0 exception for a fictional test user (D44).
  - Visitors never become members of the GitHub Organization, a Team or the
    sign-in service, never reach the members' Environments and never get the
    AI pool, Integrations or any credential of the Organization; the only AI
    the Organization gives in `try-01` is GPT-6 Luna through the capped
    gateway, whose provider key never enters `try-01`, and the Organization
    puts no secret of its own into `try-01`'s vault, which is wiped every
    night (D32 to D35, 0204 points 4 and 6).

  Remaining open details are listed under open questions; every milestone
  names what its implementer may decide.
scope:
  in:
    - >-
      L1 People, Teams and rights. Outcome: every right follows from a Team, and
      one public matrix in the Organization's access documentation says who
      reaches which module with which right and matches GitHub. Members are only
      the Lazurio maintainers and the test accounts (D20). Teams: `workspace`
      (the company's working Team, admitted by `team-01`); `lazurio-bob`
      (exists, id 20162541) and the closed per-person Team `lazurio-alena`
      (an Admin created it on 2026-10-18, id 20175101),
      each admitted only by its person's Work Environment; `finance`, Bob only,
      Write on finance; `sales`, which shares the sales modules with
      `workspace` to show N:M membership (`module_slots[].teams`; D30, proposed
      default). Restricted means Alena reads but cannot write: read stays
      public, and only Write is withheld (D23). Rulesets on the default branch
      of every public repository: pull request required, one approval,
      required CI, no force push, no deletion, no bypass for Lazurio for GitHub
      (0204 point 5). CODEOWNERS in every repository (finance and pricing to
      Bob, the rest to `workspace`). The private Deployment Repo is the one
      documented exception: GitHub Free has no rulesets for private
      repositories, so its process holds the rule. Fixed: GitHub grants are the
      only access authority for repositories; no second roster; visitors never
      get GitHub membership or a Team (D20, D33). The approval requirement is switched on only when the
      review automations of L4 run, so work does not stall. Freedom: Team names
      beyond the per-person pattern, the exact matrix, CODEOWNERS granularity,
      required check names and the merge method, which must keep the noreply
      author. Owner: Example thread. Closes infra#2.
    - >-
      L2 Environments. Outcome: each person has a place to live, the difference
      between the three kinds of Environment is visible, and the two faces of
      the lab are separate (D20). Members (D36): Bob has the Work Environment
      `lazurio-bob` as Admin (root decision 0202), signed in to GitHub with his
      own account and admitting Team `lazurio-bob`; it replaces `admin-01`,
      which is migrated and then retired, and starts fresh (D44 keeps
      `admin-01` instead and creates no `lazurio-bob`; the Owner settles it,
      Q16). Bob also has a Personal Environment with Buddy on the shared
      personal VM pool next to the other Personal Environments, never on the
      Organization's server (D42). It is a node of the Organization's tailnet,
      so its lanes live in the Organization's Deployment Repo (root decision
      0155, addendum of 2026-10-20), and it is the Ring 0 test bed for Buddy on
      the web: the bubble with its chat, the page context and Buddy's SSH reach
      into Bob's Work Environment `admin-01`, which joins the tailnet as a
      server node only (root decision 0210, D43, D44).
      Alena has the Work Environment `lazurio-alena` as an ordinary member,
      signed in to GitHub with her own account and admitting only Team
      `lazurio-alena`, and no Personal Environment. `team-01` is a real Team
      Environment of `workspace` whose GitHub identity is the Organization's
      brokered identity Lazurio for GitHub, bound to Team `workspace` instead
      of Alena's account, with the Organization's content (needs
      Lazurio/LazurioPlatform#483). The host lane declares the changes and the
      rollout pipeline applies them after its first run; `lazurio-bob` and
      `lazurio-alena` are its first real rollouts, with no manual apply from an
      operator's computer (D37).
      These are never public; GitHub defines who enters them (membership,
      Teams and grants), as in every Organization. Visitors: `try-01` is the
      Organization's one public Environment (D33), a special Environment of
      this Organization under root decision 0204, not a standard for other
      Organizations. Any signed-in Lazurio account opens it, only through its
      link (the `public-account` admission); the Lazurio Dashboard does not
      offer it, and there is no invitation, request, approval, membership or
      grant (D34). Its entry notice links `try-01`'s terms of use and privacy
      pages on lazurio.ai and says that continuing means accepting them. Its
      settings form its own Environment preset (working name Try), separate
      from the Work and Team presets: the demo onboarding, the entry notice,
      reading the Organization's public content without a GitHub identity
      (`entry.audience: public`), the vault once `try-01` has its own vault
      account, Integrations off (0204 point 4), AI from the Organization's
      capped gateway, and agent instructions so the chat agent can explain what
      this Environment and Lazurio can do. The only AI the Organization gives
      there is GPT-6 Luna, through its gateway: a CLIProxyAPI service of the
      server's services Machine `services-01` that only `try-01` reaches, with a
      dedicated provider project paid by the maintainers' Organization that
      allows only that model and has a hard monthly limit of 20 USD as the total
      cap; the gateway pins the model and caps the output of each answer, and
      there is no daily budget or request limit (D34, D39). The chat takes its
      model from the Environment's Codex configuration (D39). Until the gateway
      runs, `try-01` has no AI from the Organization (D38). The server's
      services: `services-01` holds the public entry, the certificates and
      `try-01`'s AI gateway, each in its own container with limits, and is a
      Work Environment only for the Organization's Owners and Admins, so Bob
      enters it and Alena and visitors do not; `edge-01` goes once its services
      have moved (D39). A
      visitor may sign in to their own GitHub account and AI subscription at
      the risk of the shared session and signs out after use. `try-01`'s own
      vault is simply switched on (D35, task 016): everyone who enters sees
      and may change its items and the entry notice says so, the Organization
      puts no secret of its own into it, and it is wiped every night. A
      rebuild of the server or of `try-01` does not by itself wipe the vault,
      which lives on the Organization's Conglomerate Host.
      Becoming a real
      member (an own Environment, a GitHub invitation) stays ordinary
      colleague onboarding. A public access matrix per Environment kind
      (Personal, Work, Team) and for `try-01` states who enters, which GitHub
      identity acts (the person's own account in a Work Environment, the
      Team's brokered identity in a Team Environment, none in `try-01`, which
      reads the public content anonymously), which
      modules are installed, and how AI, the vault and Integrations work
      there. Fixed: no tailnet for people (D21): entry and the vault only
      through a Lazurio login, to the members' Environments only for members,
      today by their GitHub access (0192 without its network condition, 0204),
      to `try-01` with any signed-in Lazurio account (D33); no Personal
      Environment ever runs on the Organization's server (0204 point 9, 0153);
      one Personal Environment per person (0153). Freedom: Environment names,
      sizes and order, and the name of `try-01`'s preset. Owners: Example
      thread (Deployment Repo declarations, Teams, `try-01`'s preset and vault
      account), rollout pipeline (DEV-6671) (every Machines apply), Dashboard
      thread (Dashboard pieces and `try-01`'s terms pages); for Bob's Personal
      Environment and Buddy on the web, the maintainers' Buddy work
      (DEV-6676) prepares the lanes and the rollout pipeline (DEV-6671)
      applies them (D44).
    - >-
      L3 Modules. Outcome: one module per archetype with a fictional domain,
      and every module but one with an App, so load times can be measured. Set,
      mapped from today's modules: knowledgebase stays (strategy and
      guardrails); website is new (the company's public website, Astro and
      Tailwind); design-system stays (root application); business data Apps on
      repository-db (React and Vite, generation v3): deals (new; prospects and
      the pipeline for the company's offers), pricebook (new; offer catalogue
      and rates; read only for Alena), inventory (new; stock and orders of the
      company's online shop experiment), content (today document-only; becomes
      a content calendar), finance (today document-only; becomes invoices and
      unit economics; Alena reads, only Team finance writes) and experiments
      (today documents; becomes the register of hypotheses, budgets, stop
      conditions and results, with research folded in; D26, proposed default);
      React Apps without repository-db: dashboard (new; a company overview that
      reads the other modules) and presentations (new; slides); playbooks stays
      deliberately App-less, to show how the Launchpad presents a document-only
      module (D24); automations holds the definitions of Alena's and Bob's
      review automations with a small read-only App (D25, proposed default);
      Mission Control v3 stays. Each new module is created through the normal
      creation path (`lazurio module create` in its Organization shape, with
      `--data` for repository-db, or the Dashboard's new-module dialog), which
      tests that path too; existing modules are converted by a reviewed
      refactor (root decision 0173). Every module conforms to the Lazurio
      Module Standard (`lazurio module setup` 13/13), is English and declares
      its Teams. Data comes from one public deterministic generator with a
      fixed seed and per-archetype volumes in the order of magnitude seen in
      real Organizations; amounts and prices look real but are invented (D27),
      so benchmarks mean something. Fixed: no client code or data; code reuse
      only from the maintainers' own modules, cleaned of business data; the
      generator never reads a real data source; no secrets. Freedom: module
      slugs, the set beyond one per archetype, App design, data volumes and
      where the generator lives. Owner: Example thread.
    - >-
      L4 Approval processes. Outcome: changes go through the approval processes
      a real company would use, visible in public pull requests. Alena's and
      Bob's Work Environments run review automations (the Automate tab, Lazurio
      MausBot) that review pull requests as `lazurio-alena` and `lazurio-bob`,
      the way the Lazurio maintainers' own Organization runs its review persona:
      each reviews the other's pull requests, and Bob merges as the Admin. Their
      definitions live in `automations` (D25). Pull requests from `team-01`
      (opened by the Team's brokered identity) are reviewed by an automation and
      published by a named person. Data in the repository-db Apps is published
      with "Publish changes" by people with Write, finance only by Bob.
      Fictional business approval rules are written in the playbooks (for
      example, a deal above a threshold, a discount above a limit or any price
      change needs Bob) and backed by CODEOWNERS and Team grants where GitHub
      can; elsewhere the process holds them. The automations get AI from the
      Organization's own AI pool (root decision 0181, members only), paid by
      the maintainers' own Organization: a subscription pool that runs as a
      service of `services-01` (root decision 0209) with two test subscription
      accounts the Owner signs in (D40). Fixed: an approval is a review, not a merge mandate, unless a
      pull request is handed over by assignment under the Lazurio pull request
      handoff contract; an account never approves its own pull request;
      visitors never get the AI pool (0204 point 6); Deployment Repo changes
      keep the reference Organization's rollout rule, with no persona review
      (0205 addendum of 2026-10-17, point e; D31, proposed default). Freedom:
      prompts, triggers, which repositories each automation watches, the
      business rules and their thresholds. Owner: Example thread.
    - >-
      L5 Lab operations. Outcome: the lab's scenarios have public runbooks and
      are run routinely as Bob and Alena, each run leaving a dated result.
      Scenarios: (1) rebuild the whole server from zero, with no backup, after
      which the Environments come back with the Organization's content and
      people re-enter with their Lazurio login; (2) delete Alena's Work
      Environment and add it again through the Dashboard; (3) onboarding from
      scratch: delete Alena completely, her Environment and her Lazurio account,
      and let her sign in again and onboard under her own account (D29; no
      third test account); (4) a visitor's path: a fresh Lazurio account opens
      `try-01` through its link, sees the entry notice with the terms, asks
      the chat agent what the Environment can do, adds an item to the vault,
      and signs out of its own accounts; (5) restricted versus full profile: Alena versus Bob, the
      Apps, modules she reads but cannot write; (6) with versus without a
      personal space: Bob versus Alena, the rail, Buddy, the Personal
      Workspace; (7) penetration test of the login-only entry: no Environment,
      no vault route and no `try-01` answers without a Lazurio login (D21); (8)
      Ring 0: every rollout of Machines, LazurioPlatform, Lazurio T3 Code,
      Lazurio MausBot and of entry changes in the sign-in service and the
      Dashboard lands here first and is accepted in a browser on
      `lazurio-bob` (admin), `lazurio-alena` (user) and `team-01` (team) before
      the next wave (0204 point 7, 0205 addendum point h, 0178, D36). The plan lists what the
      sign-in service, the Dashboard and Machines lack for these scenarios
      (dependencies). Fixed: runs use only the test accounts; their credentials
      never enter Git; a rebuild also wipes what visitors left in `try-01`, the
      vault is wiped every night and is empty after the wipe (task 016), and
      the entry notice says that everyone in `try-01` sees the vault and
      mentions a nightly wipe only once that wipe runs. Freedom: runbook location and format, run
      cadence, which scenarios are automated. Owners: Example thread; Dashboard
      thread for the self-service pieces.
    - >-
      L6 Benchmarks. Outcome: every App has load metrics measured the same way
      each release, before and after platform optimizations, in a public
      benchmark ledger like EX-0001's. Per App: cold start (process start to
      healthy), first open (navigation to first render) and time to
      interactive, recorded with the data volume and the versions of
      LazurioPlatform, Machines and the App. Fixed: the same method, data seed
      and Environment size on every run; one row per release; the baseline is
      measured before the first optimization lands. Freedom: the harness, where
      the ledger lives, further metrics. Owner: Example thread.
  out:
    - Client code or client data of any kind, and the names of client Organizations or client modules.
    - Code paths that exist only for this Organization (parity, 0204 addendum of 2026-10-17).
    - A backup of the dedicated server; recovery is a rebuild from zero.
    - Access for people through the tailnet, to any Environment or to the vault.
    - GitHub membership, a Team or a sign-in service membership for visitors; an invitation, access request, approval or Dashboard offer for `try-01`; any other Environment for visitors, a standard guest Environment for other Organizations (shelved, D33), and Personal Environments or Organizations for visitors; becoming a real member is ordinary colleague onboarding.
    - A third test account; scenario 3 deletes and re-onboards Alena instead (D29).
    - AI for visitors other than GPT-6 Luna through the capped gateway, and the members' AI pool for visitors (D34, D39).
    - The Lazurio product work the lab depends on (Dashboard self-service, account deletion or reset, Environment removal in Machines, the vault route and the nightly vault wipe, `try-01`'s preset with its vault page and guide, the capped AI gateway, Buddy on the web (DEV-6676), Team Environment content); the lab consumes it and records the gaps it finds.
    - An English locale of the Mission Control UI (Lazurio/mission-control#1).
    - The close-out of EX-0001 (A1), which stays in EX-0001.
acceptance_criteria:
  - GitHub Teams and grants match the public access matrix; the default branch of every public repository requires a pull request, an approval and CI and forbids force pushes and deletion; every repository has CODEOWNERS.
  - Bob opens `lazurio-bob` and his Personal Environment; Alena opens her own Work Environment `lazurio-alena` and has no Personal Environment; each acts on GitHub with their own account; a member of `workspace` opens `team-01` with the Organization's content, where GitHub acts as Lazurio for GitHub; `admin-01` is retired. None of them is reachable by a visitor or by anyone outside the GitHub Organization. Everyone enters with a Lazurio login and no tailnet, except that Bob's Personal Environment is reached from his test device over the tailnet (D44); verified in a browser (0178).
  - "Ring 0 acceptance of Buddy on the web (D42 to D44): Bob opens the bubble in Apps, Chat and Automate on `admin-01`, chats with his Buddy, and Buddy reaches `admin-01` over SSH from Bob's Personal Environment; Alena, who has no Personal Environment, sees the neutral Lazurio guide in the bubble; verified in a browser (0178)."
  - Anyone with a Lazurio account opens `try-01` through its link, and the Lazurio Dashboard does not offer it; there is no request, approval or membership; the entry notice links `try-01`'s terms of use and privacy pages; `try-01` has its own vault switched on (D35); verified in a browser (0178).
  - "In `try-01` a visitor opens the vault from Apps and can add an item; the entry notice says that everyone who enters sees and may change the vault's items; after the nightly wipe the vault is empty; verified in a browser and by reading the vault back (0178)."
  - "In `try-01` the chat agent answers through GPT-6 Luna on the Organization's capped gateway and explains what the Environment and Lazurio can do; the gateway is a CLIProxyAPI service of `services-01` and only `try-01` reaches it; no other model answers, every answer stays within the gateway's output cap, the provider refuses requests once the 20 USD monthly limit is reached (HTTP 429) and the gateway does not retry them, the chat uses the model from the Environment's Codex configuration, the provider key is not in `try-01`, and no shared AI account of the maintainers is signed in there; before the gateway started, the Owner confirmed that the maintainers' shared AI account had all its sessions revoked at the provider and that the paying organization keeps only the gateway's key; verified in a browser (0178)."
  - "`edge-01` is gone: the public entry and the certificates run as services of `services-01`, each in its own container with limits, and every Environment of the Organization is reached as before; Bob (Owner) opens `services-01` as a Work Environment, while Alena and visitors cannot enter it; verified in a browser (0178)."
  - "In `try-01` a visitor opens the vault from Apps and the in-place guide explains the page in words that fit `try-01`: a shared Environment whose vault entries every visitor sees and which is wiped every night, a vault reached through a Lazurio login, and no invitation to store the visitor's own passwords there (D32); verified in a browser (0178)."
  - A penetration test shows that no Environment, no vault route and not `try-01` answers without a Lazurio login.
  - Every archetype is present once, every module but playbooks has an App on generation v3 (or the documented current generation of its archetype), `lazurio module setup` reports 13/13, modules that hold data keep it on repository-db, every new module came through the normal creation path, and the generated data has the recorded volumes.
  - Alena reads the restricted modules but cannot write them; Bob writes every module; verified in a browser.
  - A pull request by Alena is approved by Bob's automation, one by Bob is approved by Alena's automation, and Bob merges both without a bypass.
  - Every Ring 0 rollout is accepted in a browser on `lazurio-bob`, `lazurio-alena` and `team-01` before the next wave (D36).
  - Every L5 scenario has a runbook and at least one dated run; the server rebuild, the delete-and-re-add of Alena's Work Environment and her complete re-onboarding are timed.
  - The benchmark ledger has a baseline row for every App and one row for every later release.
  - A search across every repository of the Organization finds no client name and no private reference.
